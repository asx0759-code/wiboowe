<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="build" content="20261110-1010b">
<meta http-equiv="Cache-Control" content="no-cache">
<title>위시 부흥 위원회</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 29S3 21 3 11.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 3.5C29 21 16 29 16 29z%22 fill=%22%23000%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Poor+Story&display=swap">
<style>
@font-face{font-family:"MaruMinya JP";src:url("MaruMinya.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
/* Layout: one pink phone centered on a pastel sky; every screen lives inside its LCD, nav pinned to the bottom like a 2000s handset */
:root{
  --sky-a:#e9e8ec; --sky-b:#cfced6;
  --shell:#1c1b1f; --shell-hi:#4a4950; --shell-lo:#060608;
  --pink:#2b2a2f; --pink-deep:#111013; --pink-soft:#6b6a72;
  --lcd:#ffffff; --line:#dcdbe0; --ink:#1a191c; --muted:#85848c;
  --bar:#ececef; --sky-text:#3a393f; --tint:#f2f1f4; --rule:#e6e5ea; --acc:#c9c8cf;
  --pixel:"MaruMinya JP","DotGothic16","Courier New",monospace;
  --hand:"MaruMinya JP","Poor Story","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:radial-gradient(circle at 20% 15%,#fff 0 2px,transparent 3px) 0 0/90px 90px,
             radial-gradient(circle at 70% 60%,#fff 0 1.5px,transparent 2.5px) 0 0/120px 120px,
             linear-gradient(160deg,var(--sky-a),var(--sky-b));
  color:var(--ink);font-family:var(--hand);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.note{font-family:var(--pixel);font-size:12px;color:var(--sky-text);letter-spacing:.04em;text-align:center}
.phone{
  width:min(100%,380px);
  background:linear-gradient(145deg,var(--shell-hi),var(--shell) 40%,var(--shell-lo));
  border-radius:54px;padding:26px 16px 36px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -4px 10px rgba(0,0,0,.5),0 18px 40px rgba(20,20,30,.35);
}
.top{display:flex;justify-content:center;align-items:center;gap:22px;height:40px;margin-bottom:12px}
.speaker{width:96px;height:18px;border-radius:12px;background:#000;box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.2)}
.cam{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#556,#000)}
.lcd{
  background:var(--lcd);border:3px solid #000;border-radius:4px;
  height:560px;display:flex;flex-direction:column;overflow:hidden;
}
.status{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:linear-gradient(#f6f6f7,var(--bar));border-bottom:1px solid var(--line);font-family:var(--pixel);font-size:12px}
.status .icons{display:flex;gap:6px;align-items:center}
.bat{width:30px;height:12px;border:2px solid #222;border-radius:2px;position:relative;padding:1px}
.bat::after{content:"";position:absolute;right:-5px;top:2px;width:3px;height:5px;background:#222}
.bat i{display:block;height:100%;width:80%;background:linear-gradient(90deg,#3b2a8f,#e04aa8)}
.head{background:linear-gradient(var(--pink-soft),var(--pink) 55%,var(--pink-deep));color:#fff;text-align:center;font-family:var(--pixel);font-size:20px;padding:10px 40px;position:relative;text-shadow:0 1px 0 rgba(0,0,0,.6);min-height:24px}
.head button{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-family:var(--pixel);font-size:18px;cursor:pointer;padding:4px 8px}
.body{flex:1;overflow-y:auto;min-height:0}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(var(--pink-soft),var(--pink) 50%,var(--pink-deep))}
.nav button{background:none;border:0;color:#fff;font-family:var(--pixel);font-size:14px;padding:12px 0;cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.nav button.on{background:rgba(255,255,255,.28)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px dashed var(--pink-deep);outline-offset:2px}

/* list rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:2px solid var(--line);cursor:pointer;background:var(--lcd);width:100%;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit}
.row:hover{background:var(--tint)}
.num{flex:none;width:28px;height:28px;background:var(--pink);color:#fff;font-family:var(--pixel);font-size:14px;display:grid;place-items:center;box-shadow:inset -2px -2px 0 var(--pink-deep)}
.row svg{flex:none}
.ttl{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ttl.secret{color:var(--muted)}
.row .meta{font-family:var(--pixel);font-size:12px;color:var(--muted);flex:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}

/* forms */
.form{padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--pixel);font-size:12px;color:var(--muted);letter-spacing:.06em}
.field input,.field textarea,.field select{font-family:var(--hand);font-size:16px;border:2px solid var(--line);background:#fff;padding:6px 10px;color:var(--ink);border-radius:0}
.field textarea{resize:none;height:130px;line-height:1.6;background:repeating-linear-gradient(#fff 0 26px,var(--rule) 26px 27px);background-attachment:local}
.count{font-family:var(--pixel);font-size:12px;color:var(--muted);text-align:right}
.btn{font-family:var(--pixel);font-size:16px;color:#fff;background:linear-gradient(var(--pink-soft),var(--pink) 55%,var(--pink-deep));border:0;padding:11px;cursor:pointer;box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line)}
.tabs button{font-family:var(--pixel);font-size:14px;background:#fff;border:0;padding:10px;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--pink-deep);box-shadow:inset 0 -3px 0 var(--pink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--pink)}
.seg button{font-family:var(--hand);font-size:15px;background:#fff;border:0;padding:6px;cursor:pointer;color:var(--pink-deep)}
.seg button.on{background:var(--pink);color:#fff}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.err{font-size:12px;color:var(--pink-deep);min-height:1em}

/* read */
.letter{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.from{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--acc);padding-bottom:6px;gap:8px}
.from b{font-size:17px}
.from span{font-family:var(--pixel);font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--pixel);font-size:12px;color:#fff;background:var(--pink-deep);padding:2px 6px;align-self:flex-start}
.chip.pub{background:var(--muted)}
.text{font-size:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.reply{background:var(--tint);border-left:4px solid var(--pink);padding:8px 10px;font-size:15px;line-height:1.4}
.reply small{display:block;font-family:var(--pixel);font-size:12px;color:var(--pink-deep);margin-bottom:2px}
.reply-form{display:flex;gap:6px}
.reply-form input{flex:1;min-width:0;font-family:var(--hand);font-size:15px;border:2px solid var(--line);padding:4px 8px}
.reply-form button{font-family:var(--pixel);font-size:12px;background:var(--pink);color:#fff;border:0;padding:0 12px;cursor:pointer}

/* home */
.me{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:2px solid var(--line);background:linear-gradient(#fff,var(--tint))}
.av{width:52px;height:52px;background:var(--pink);border:2px solid var(--pink-deep);display:grid;place-items:center;font-family:var(--pixel);font-size:22px;color:#fff;flex:none}
.me b{font-size:19px;display:block}
.me span{font-family:var(--pixel);font-size:12px;color:var(--muted)}
.sect{font-family:var(--pixel);font-size:12px;color:var(--muted);padding:10px 14px 4px;letter-spacing:.06em}

/* music */
.now{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.disc{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fff 0 10px,var(--pink-deep) 11px 14px,#2a2228 15px 60px,#3a3038 61px);animation:spin 6s linear infinite;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.track{font-size:18px}
.listeners{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.listeners span{font-family:var(--pixel);font-size:12px;background:var(--tint);color:var(--pink-deep);padding:3px 8px}

.homewrap{min-height:100%;display:flex;flex-direction:column}
.foot{margin-top:auto;padding:28px 14px 12px;text-align:center}
.out{background:none;border:0;font-family:var(--pixel);font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 10px}
.lp{position:relative;width:150px;height:150px;flex:none;border-radius:50%;background:repeating-radial-gradient(circle,#1b1a1e 0 2px,#2a292e 2px 4px);box-shadow:0 6px 16px rgba(0,0,0,.3);overflow:hidden;animation:spin 5s linear infinite;animation-play-state:paused}
.lp.on{animation-play-state:running}
.lp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;transform:scale(1.35)}
.lp::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--lcd);box-shadow:0 0 0 4px rgba(0,0,0,.55)}
.lp .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 0 30%,rgba(0,0,0,.18) 31%,transparent 33%,transparent 60%,rgba(255,255,255,.08) 61%,transparent 63%)}
.ctrl{display:flex;gap:8px;width:100%}
.ctrl input{flex:1;min-width:0;font-family:var(--hand);font-size:12px;border:2px solid var(--line);padding:6px 8px}
.ctrl button,.play{font-family:var(--pixel);font-size:12px;background:var(--pink);color:#fff;border:0;padding:0 12px;cursor:pointer}
.play{padding:8px 22px;font-size:15px;box-shadow:0 3px 0 #000}
@media (prefers-reduced-motion:reduce){.lp{animation:none}}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(34,32,36,.88);color:#fff;font-family:var(--pixel);font-size:12px;padding:8px 14px;white-space:nowrap}
.lcdwrap{position:relative}
.home-btn{width:54px;height:54px;border-radius:50%;margin:16px auto 0;background:linear-gradient(145deg,var(--shell-hi),var(--shell-lo));box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.2);border:0;display:block;cursor:pointer}


.av{overflow:hidden;padding:0;position:relative}
.av img,.mini img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.avbtn{cursor:pointer}
.cam-badge{position:absolute;right:0;bottom:0;width:16px;height:16px;background:#000;color:#fff;font-size:12px;line-height:16px;text-align:center;font-family:var(--pixel)}
.me > div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.mini{flex:none;position:relative;width:28px;height:28px;overflow:hidden;background:var(--tint);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--pixel);font-size:12px;color:var(--pink-deep)}
.who{display:flex;align-items:center;gap:8px;min-width:0}

.crop{position:absolute;inset:3px;z-index:20;background:rgba(10,10,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.crop-title{font-family:var(--pixel);color:#fff;font-size:15px}
.crop-frame{position:relative;width:240px;height:240px;overflow:hidden;background:#000;touch-action:none;cursor:grab;outline:2px solid #fff}
.crop-frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 33.3% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 66.6% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 0 33.3%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 0 66.6%/100% 1px no-repeat}
.crop-img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
#cz{width:240px;accent-color:#fff}
.crop-btns{display:flex;gap:10px}
.crop-btns button{font-family:var(--pixel);font-size:14px;padding:8px 22px;border:2px solid #fff;background:none;color:#fff;cursor:pointer}
.crop-btns #ck{background:#fff;color:#000}
.crop-hint{font-family:var(--pixel);font-size:12px;color:#aaa;margin:0}
.attach{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.attach .out{padding:4px 0;font-size:12px}
#prev{display:flex;align-items:center;gap:8px}
#prev img{width:48px;height:48px;object-fit:cover;border:1px solid var(--line)}
.photo{border:1px solid var(--line);background:var(--tint);min-height:60px;display:grid;place-items:center}
.photo img{width:100%;display:block}
.photo span{font-family:var(--pixel);font-size:12px;color:var(--muted);padding:20px}

.ctrl-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.play.ghost{background:#fff;color:var(--pink-deep);box-shadow:0 3px 0 #000;border:2px solid var(--pink-deep)}
.qlist{width:100%;text-align:left;border-top:2px solid var(--line);padding-top:8px}
.qrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.qrow .num{width:22px;height:22px;font-size:12px}
.qt{flex:1;min-width:0;font-size:12px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qt small{display:block;font-family:var(--pixel);font-size:12px;color:var(--muted)}
.qrow .out{font-size:16px;text-decoration:none;padding:2px 8px}
.links{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:center}
.links .out{padding:4px 0}
.now .track{font-size:15px;line-height:1.4;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#yt-box{position:fixed;left:-1000px;top:0;width:240px;height:200px;overflow:hidden;pointer-events:none}
#yt-box.show{position:absolute;left:22px;right:22px;top:auto;bottom:62px;width:auto;height:200px;opacity:1;pointer-events:auto;z-index:5;border:3px solid #000;background:#000}
.btn:disabled{opacity:.6}
.bc{display:inline-block;font-family:var(--pixel);font-size:12px;background:var(--pink);color:#fff;padding:0 5px;margin-right:6px;vertical-align:1px}
.rtime{margin-left:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.text a{color:var(--pink-deep);word-break:break-all}
.ytwrap{display:flex;flex-direction:column;gap:4px}
.ytc{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border:2px solid #000;overflow:hidden;cursor:pointer}
.ytc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.ytc iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytplay{position:absolute;left:50%;top:50%;width:52px;height:36px;margin:-18px 0 0 -26px;background:#e00;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.ytplay::after{content:"";position:absolute;left:21px;top:10px;border-style:solid;border-width:8px 0 8px 14px;border-color:transparent transparent transparent #fff}
.ytmeta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.ytmeta .ytt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ytmeta a{flex:none;color:var(--muted);font-family:var(--pixel)}
.ytprev{display:flex;gap:6px;margin-top:4px}
.ytprev img{width:96px;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line)}
.pix{flex:none;display:block;image-rendering:pixelated}
.pix-img{image-rendering:auto;object-fit:contain;max-width:none}
.pix-img.photo-it{object-fit:cover;border-radius:4px}
.ic{flex:none;width:24px;display:flex;align-items:center;justify-content:center}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.itbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;background:#fff;border:2px solid var(--line);cursor:pointer;font-family:var(--hand);font-size:12px;color:var(--ink)}
.itname{white-space:pre-line;text-align:center;line-height:1.25}
.itbtn.on{border-color:var(--pink-deep);background:var(--tint);box-shadow:inset 0 0 0 1px var(--pink-deep)}
.anon{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.anon input{width:16px;height:16px;accent-color:var(--pink-deep);margin:0}
.reveal{border:2px dashed var(--acc);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.reveal .hint{margin:0}
.itembox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:var(--tint);border:2px dashed var(--acc)}
.itembox b{font-size:16px}
.itembox span{font-size:12px;color:var(--muted)}
.adm-who{display:block;font-family:var(--pixel);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.vol{display:flex;align-items:center;gap:8px;width:100%;max-width:260px;font-family:var(--pixel);font-size:12px;color:var(--muted)}
.vol input{flex:1;min-width:0;accent-color:var(--pink-deep);height:20px}
.vol #volv{width:26px;text-align:right;font-variant-numeric:tabular-nums}
.ytopen{display:inline-block;text-decoration:none;background:#c00;box-shadow:0 3px 0 #600;color:#fff}
.extform{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left;border:2px dashed var(--acc);padding:10px}
.extform input{font-family:var(--hand);border:2px solid var(--line);padding:6px 8px}

/* 수정 */
.edited{font-family:var(--pixel);font-size:12px;color:var(--muted);align-self:flex-end}
.out.inline{padding:0;font-size:12px;color:var(--pink-deep)}
.ghostbtn{background:none!important;color:var(--muted)!important;font-size:16px!important}
/* 모바일: 페이지 전체는 고정하고, 폰 화면 안쪽만 스크롤 */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));justify-content:center;touch-action:manipulation}
.phone{display:flex;flex-direction:column;height:min(100%,760px);min-height:0}
.lcdwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.lcd{height:auto;flex:1;min-height:0}
.body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.top,.home-btn{flex:none}
input,textarea,select{font-size:16px!important}
@media (max-height:760px){
  .phone{padding:16px 12px 18px;border-radius:42px}
  .top{height:26px;margin-bottom:8px}
  .home-btn{width:42px;height:42px;margin-top:10px}
}
@media (max-width:420px){ body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))} }
</style>
</head>
<body>
<div class="phone">
  <div class="top"><div class="speaker"></div><div class="cam"></div></div>
  <div class="lcdwrap">
    <div class="lcd">
      <div class="status">
        <div class="icons">
          <svg width="22" height="14" viewBox="0 0 22 14"><path d="M1 1h8L5 6z" fill="#2a6fd8"/><rect x="4.5" y="6" width="1.5" height="8" fill="#2a6fd8"/><rect x="9" y="9" width="2" height="5" fill="#2a6fd8"/><rect x="12" y="7" width="2" height="7" fill="#2a6fd8"/><rect x="15" y="4" width="2" height="10" fill="#9ab8e8"/><rect x="18" y="1" width="2" height="13" fill="#9ab8e8"/></svg>
          <svg width="16" height="14" viewBox="0 0 16 14"><rect x="0.5" y="0.5" width="15" height="13" rx="2" fill="#2a6fd8"/><path d="M5 4l5 5-2.5 2.5V2.5L10 5l-5 5" stroke="#fff" stroke-width="1.3" fill="none"/></svg>
        </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

/* ===== Firebase 설정 (weboowe) ===== */
const firebaseConfig = {

  projectId: "weboowe-84b14",

/* ============================================================ */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ENV_C = '<svg width="24" height="18" viewBox="0 0 24 18"><rect x="1" y="1" width="22" height="16" fill="#e8f6fb" stroke="#5b8ea3" stroke-width="1.5"/><path d="M1 1l11 9 11-9M1 17l8-7M23 17l-8-7" fill="none" stroke="#5b8ea3" stroke-width="1.5"/></svg>';
const ENV_O = '<svg width="24" height="18" viewBox="0 0 24 18"><path d="M1 7l11-6 11 6v10H1z" fill="#fff" stroke="#b9a9b4" stroke-width="1.5"/><path d="M1 7l11 7 11-7" fill="none" stroke="#b9a9b4" stroke-width="1.5"/></svg>';
const LOCK = '<svg width="18" height="20" viewBox="0 0 18 20"><rect x="2" y="9" width="14" height="10" fill="#2b2a2f" stroke="#111013" stroke-width="1.5"/><path d="M5 9V6a4 4 0 018 0v3" fill="none" stroke="#111013" stroke-width="2"/><rect x="8" y="12" width="2" height="4" fill="#fff"/></svg>';

const S = {
  me: null, screen: 'login', authTab: 'login', owner: null, open: null, vis: 'pub', to: null,
  users: {},          // uid -> nick
  photos: {},         // uid -> 프로필 사진

  other: [],          // messages to the guestbook being viewed
  priv: {},           // message id -> private content (secret ones I can read)
  imgs: {},           // message id -> 첨부 사진

  vol: (() => { try { const v = parseInt(localStorage.getItem('wb_vol'), 10); return Number.isFinite(v) ? v : 80 } catch { return 80 } })(),

};
const subs = {};
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nickOk = n => n.length >= 1 && n.length <= 12 && !/[\/\s]/.test(n);
function nickEmail(n) { // 한글 닉네임도 로그인 주소로 쓸 수 있게 바꿔 줌
  return 'u' + Array.from(new TextEncoder().encode(n.normalize('NFC')), b => b.toString(16).padStart(2, '0')).join('') + '@pinkphone.app';
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, t.length > 25 ? 4000 : 1800) }
function fmt(ts) { if (!ts?.toDate) return '방금'; const d = ts.toDate(), p = n => String(n).padStart(2, '0'); return `${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}` }
const ms = ts => ts?.toMillis ? ts.toMillis() : Date.now();
function refresh() { if (S.screen !== 'send' && !S.editMsg && !S.editReply && !document.querySelector('#view .ytc iframe')) render() } // 영상 재생 중엔 화면을 다시 그리지 않음
function go(screen, extra = {}) { Object.assign(S, { screen, confirmDel: false, editMsg: false, editReply: false, confirmReveal: false }, extra); if (screen === 'inbox') watchOwner(); watchListeners(); render() }
// '같이 듣는 사람' 목록은 MUSIC 화면을 보고 있을 때만 받아 옴 (Firebase 무료 사용량 아끼기)
function watchListeners() {
  if (S.screen === 'music' && S.me && !subs.lis) subs.lis = onSnapshot(collection(db, 'room', 'main', 'listeners'), q => { S.listeners = []; q.forEach(d => S.listeners.push({ uid: d.id, ...d.data() })); if (S.screen === 'music') render() });
  if (S.screen !== 'music' && subs.lis) { subs.lis(); delete subs.lis }
}
function unsub(k) { if (subs[k]) { subs[k](); delete subs[k] } }

/* ===== 로그인 상태 ===== */
let signingUp = false;
onAuthStateChanged(auth, async u => {
  if (!u) { cleanup(); S.me = null; go('login'); return }
  if (signingUp) return;
  await loadMe(u);
});
async function loadMe(u) {
  const snap = await getDoc(doc(db, 'users', u.uid)).catch(() => null);
  if (!snap || !snap.exists()) { await signOut(auth); return }
  S.me = { uid: u.uid, nick: snap.data().nick }; S.loginErr = '';
  S.isAdmin = false; getDoc(doc(db, 'admins', u.uid)).then(d => { S.isAdmin = d.exists(); refresh() }).catch(() => { });
  subs.users = onSnapshot(collection(db, 'users'), q => { S.users = {}; S.photos = {}; S.crops = {}; q.forEach(d => { const u = d.data(); S.users[d.id] = u.nick; if (u.photo) S.photos[d.id] = u.photo; if (u.crop) S.crops[d.id] = u.crop }); refresh() });
  subs.mine = onSnapshot(query(collection(db, 'messages'), where('to', '==', u.uid)), q => {
    S.mine = list(q); loadPriv(S.mine);

    const ids = new Set(S.mine.map(m => m.id));
    if (mineSeen && S.mine.some(m => !mineSeen.has(m.id) && m.kind === 'item' && !m.read)) toast('아이템이 도착했어요!');
    if (mineSeen && S.mine.some(m => !mineSeen.has(m.id) && m.bc && !m.read)) toast('전체 쪽지가 도착했어요!');
    mineSeen = ids; refresh();

  preparePlayer();
  getProbe().catch(() => { });
  measureClock(false);
}
let mineSeen = null;
function cleanup() { mineSeen = null; S.isAdmin = false; S.adm = null; Object.keys(subs).forEach(unsub); leaveRoom(); S.mine = []; S.other = []; S.priv = {}; Object.keys(privSub).forEach(k => delete privSub[k]); Object.keys(anonChk).forEach(k => delete anonChk[k]); S.users = {}; S.photos = {} }
function list(q) { const a = []; q.forEach(d => a.push({ id: d.id, ...d.data() })); return a.sort((x, y) => ms(y.createdAt) - ms(x.createdAt)) }
// 익명으로 보낸 메시지가 내 것인지 확인 (보낸 본인과 관리자만 meta/sender 를 읽을 수 있음)
const anonChk = {}, privSub = {};
// 익명으로 보낸 내용은 보낸 기기에도 따로 기억해 둠 (서버 확인이 늦거나 막혀도 바로 보이게)
const localAnon = (() => { try { return JSON.parse(localStorage.getItem('wb_anon') || '{}') } catch { return {} } })();
function saveLocalAnon(id, data) { localAnon[id] = data; try { localStorage.setItem('wb_anon', JSON.stringify(localAnon)) } catch { } }
function checkAnon(arr) {
  arr.filter(m => m.anon && m.to !== S.me?.uid && !(m.id in anonChk)).forEach(m => {
    if (localAnon[m.id]) { anonChk[m.id] = true; loadPriv([m]); return }
    anonChk[m.id] = 'pending';
    getDoc(doc(db, 'messages', m.id, 'meta', 'sender')).then(d => {
      anonChk[m.id] = d.exists() && d.data().uid === S.me?.uid;
      if (anonChk[m.id]) { loadPriv([m]); refresh() }
    }).catch(() => { anonChk[m.id] = false });
  });
}
const sentByMe = m => m.from === S.me?.uid || anonChk[m.id] === true;
let rulesWarned = false;
function loadPriv(arr) {
  arr.filter(m => m.secret && !privSub[m.id] && (m.to === S.me?.uid || sentByMe(m))).forEach(m => {
    privSub[m.id] = true;
    if (!S.priv[m.id] || S.priv[m.id] === 'loading') S.priv[m.id] = localAnon[m.id] || 'loading';
    subs['p' + m.id] = onSnapshot(doc(db, 'messages', m.id, 'private', 'content'), d => { if (d.exists()) { S.priv[m.id] = d.data(); refresh() } }, err => {
      if (err?.code === 'permission-denied' && m.anon && !rulesWarned) { rulesWarned = true; console.warn('anon private read denied', m.id); if (!localAnon[m.id]) toast('익명 비밀 메시지를 보려면 Firebase 보안 규칙을 최신으로 게시해 주세요') }

}

}

function content(m) { // 화면에 보여 줄 제목·내용·답장
  if (!m.secret) return m;
  const p = S.priv[m.id];
  return p && p !== 'loading' ? p : null;
}

/* ===== 화면 ===== */
function render() {
  const v = $('#view'), h = $('#head');

  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === S.screen || (S.screen === 'read' && b.dataset.go === 'inbox' && S.owner === S.me?.uid)));

      ${r?.ext ? `<a class="play ytopen" id="ytopen" href="https://www.youtube.com/watch?v=${t}" target="_blank" rel="noopener">▶ 유튜브에서 열기</a>
        <p class="hint"><span id="extt">${fmtT(target(r))}${r.dur ? ' / ' + fmtT(r.dur) : ''}</span><br>사이트 안에서는 재생이 막힌 곡이라 유튜브에서 들어요.${r.dur ? '' : '<br>다 들으면 NEXT를 눌러 주세요.'}<br>버튼을 누르면 지금 위치부터 열려요. PC에서는 LP판 위에 작은 창으로 떠요.</p>` : ''}
      <div class="ctrl-row">
        ${!S.joined ? `<button class="play" id="join">♪ 같이 듣기</button>`
          : t ? `<button class="play" id="play">${r.playing ? '❚❚ PAUSE' : '▶ PLAY'}</button><button class="play ghost" id="skip">NEXT ▶▶</button>` : ''}
      </div>
      ${S.joined ? `<div class="vol"><span aria-hidden="true">VOL</span><input type="range" id="vol" min="0" max="100" step="1" value="${S.vol}" aria-label="음량"><span id="volv">${S.vol}</span></div>` : ''}
      <form class="ctrl" id="yt"><input id="yturl" placeholder="유튜브 링크로 곡 추가"><button>ADD</button></form>
      <div class="err" id="err">${esc(S.ytErr || '')}</div>
      ${S.extPending ? `<form class="extform" id="xf">
          <p class="hint">이 영상은 사이트 안에서 재생이 막혀 있어요.<br>대신 "유튜브에서 같이 듣기"로 넣을 수 있어요. 차례가 오면 유튜브에서 열고, 곡 길이만큼 지나면 다음 곡으로 넘어가요.</p>
          <input id="xt" maxlength="60" placeholder="곡 제목 (예: 아이유 - 밤편지)" value="${esc(S.extPending.title)}">
          <input id="xd" inputmode="numeric" placeholder="곡 길이 (예: 3:45)">
          <div class="err" id="xerr"></div>
          <div class="ctrl-row"><button type="button" class="play ghost" id="xc">취소</button><button class="play">넣기</button></div>
        </form>` : ''}
      ${S.loadingYT && S.joined ? '<p class="hint">플레이어를 준비하는 중이에요…</p>' : ''}
      ${S.needTap ? '<p class="hint">브라우저가 소리를 막았어요. 아래 영상의 재생 버튼을 한 번 직접 눌러 주세요.</p>' : ''}
      <div class="qlist">
        <div class="sect" style="padding:0 0 4px">NEXT UP · ${q.length}</div>
        ${q.length ? q.map((it, i) => `<div class="qrow"><span class="num">${i + 1}</span><span class="qt">${esc(it.title || '제목을 불러오지 못한 곡')}<small>${esc(it.pick || '')}</small></span>${it.by === S.me.uid ? `<button class="out" data-rm="${i}" aria-label="빼기">×</button>` : ''}</div>`).join('')
          : '<p class="hint">다음 곡이 없어요. 링크를 추가하면 지금 곡이 끝난 뒤에 이어서 나와요.</p>'}
      </div>
      <div class="links">
        ${S.joined ? `<button class="out" id="vid">${S.showVideo ? '영상 숨기기' : '영상 보기'}</button>
        <button class="out" id="wake">${S.wake ? '화면 켜두기 끄기' : '화면 켜두기'}</button>
        <button class="out" id="leave">그만 듣기</button>` : ''}
      </div>
      <div class="sect" style="padding:0">LISTENING NOW · ${live.length}</div>
      <div class="listeners">${live.map(l => `<span>${esc(l.nick)}${l.uid === S.me.uid ? ' (나)' : ''}</span>`).join('') || '<span>아무도 없어요</span>'}</div>
    </div>`;
    v.querySelectorAll('.lp img').forEach(i => i.onerror = () => i.remove());
    keepIn.forEach(k => { const el = $('#' + k.id); if (!el) return; el.value = k.v; if (k.f) { el.focus(); try { el.setSelectionRange(k.p, k.p) } catch { } } });
    if ($('#join')) $('#join').onclick = joinRoom;
    if ($('#leave')) $('#leave').onclick = () => { leaveRoom(); render() };
    if ($('#vid')) $('#vid').onclick = () => { S.showVideo = !S.showVideo; $('#yt-box').classList.toggle('show', S.showVideo); render() };
    if ($('#wake')) $('#wake').onclick = toggleWake;
    if ($('#vol')) $('#vol').oninput = e => setVol(+e.target.value);
    if ($('#play')) $('#play').onclick = togglePlay;
    if ($('#skip')) $('#skip').onclick = () => advance(null);
    if ($('#ytopen')) $('#ytopen').onclick = e => {
      const rr = S.room; if (!rr?.ext) return;
      const url = `https://www.youtube.com/watch?v=${rr.videoId}&t=${Math.floor(target(rr))}s`;
      e.currentTarget.href = url;
      // PC: 사이트 옆에 작은 창으로 띄움 / 휴대폰: 새 탭이나 유튜브 앱 (브라우저가 작은 창을 지원하지 않음)
      const pc = matchMedia('(pointer:fine)').matches && screen.width > 800;
      if (!pc) return;
      // LP판이 화면 어디에 있는지 계산해서, 작은 창의 가운데가 LP판 가운데에 오게 함
      const w = 420, h = 320, lp = document.querySelector('.lp')?.getBoundingClientRect();
      const chromeX = Math.max(0, (window.outerWidth - window.innerWidth) / 2), chromeY = Math.max(0, window.outerHeight - window.innerHeight - chromeX);
      const cx = lp ? (window.screenX || 0) + chromeX + lp.left + lp.width / 2 : (window.screenX || 0) + window.outerWidth / 2;
      const cy = lp ? (window.screenY || 0) + chromeY + lp.top + lp.height / 2 : (window.screenY || 0) + window.outerHeight / 2;
      const left = Math.max(0, Math.round(cx - w / 2)), top = Math.max(0, Math.round(cy - h / 2));
      const pop = window.open(url, 'wiboowe_yt', `popup=yes,width=${w},height=${h},left=${left},top=${top}`);
      if (pop) { e.preventDefault(); ytPop = pop; popVid = rr.videoId; try { pop.focus() } catch { } }
    };
    if ($('#xc')) $('#xc').onclick = () => { S.extPending = null; render() };
    if ($('#xf')) $('#xf').onsubmit = async e => {
      e.preventDefault();
      const id = S.extPending.id, title = $('#xt').value.trim(), dur = parseDur($('#xd').value);
      if (!title) { $('#xerr').textContent = '곡 제목을 적어 주세요.'; return }
      if (!dur) { $('#xerr').textContent = '곡 길이를 3:45처럼 적어 주세요.'; return }
      const item = { videoId: id, title, by: S.me.uid, pick: S.me.nick, ext: true, dur };
      let now = false;
      await roomTx(cur => {
        if (!cur.videoId || !cur.playing) { now = true; return { ...cur, ...item, playing: true, startAt: srvNow(), pos: 0 } }
        const qq = [...(cur.queue || [])];
        if (qq.length >= QMAX) { toast('다음 곡은 ' + QMAX + '곡까지예요'); return null }
        qq.push(item); return { ...cur, queue: qq };
      });
      S.extPending = null; toast(now ? '지금 곡이에요. 유튜브에서 열어 주세요' : '다음 곡 목록에 넣었어요'); render();
    };
    v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => roomTx(cur => {
      const qq = [...(cur.queue || [])], k = +b.dataset.rm;
      if (qq[k]?.by !== S.me.uid) return null;
      qq.splice(k, 1); return { ...cur, queue: qq };
    }));
    $('#yt').onsubmit = async e => {
      e.preventDefault();
      const u = $('#yturl').value.trim();
      const m = u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/) || u.match(/^([\w-]{11})$/);
      if (!m) { $('#err').textContent = '유튜브 링크를 확인해 주세요.'; return }
      const id = m[1]; S.ytErr = '';
      if (!S.joined) { S.joined = true; heartbeat(); clearInterval(beat); beat = setInterval(heartbeat, 90000) }
      $('#yturl').value = '';
      $('#err').textContent = '재생되는 영상인지 확인하는 중이에요…';
      // 넣기 전에 미리 확인: 막힌 영상이면 처음부터 대신 틀 영상으로 넣음
      const [info, test] = await Promise.all([ytInfo(id), testPlayable(id)]);
      $('#err').textContent = '';
      if (info.missing || test === 'missing') { S.ytErr = '없거나 비공개인 영상이에요.'; render(); return }
      let vid = id, title = info.title, swapped = false;
      if (info.blocked || test === 'blocked') {
        $('#err').textContent = '막힌 영상이라 같은 노래의 다른 영상을 찾는 중이에요…';
        let alt = null;
        if (YT_KEY) {
          const tried = [id];
          for (let k = 0; k < 3 && !alt; k++) { // 찾은 영상도 미리 확인해서, 되는 것만 넣음
            const cand = await findAltFor(id, title, tried);
            if (!cand) break;
            tried.push(cand.id);
            if ((await testPlayable(cand.id)) !== 'blocked') alt = cand;
          }
        }
        $('#err').textContent = '';
        if (!alt) { S.ytErr = '이 노래는 재생할 수 있는 영상을 찾지 못해서 넣지 않았어요.'; render(); return }
        vid = alt.id; title = title || alt.title; swapped = true;
      }
      const idle = !S.room?.videoId || !S.room.playing;
      if (idle) startNow(vid, 0);
      const item = { videoId: vid, title, by: S.me.uid, pick: S.me.nick };
      const ok = await roomTx(cur => {
        if (!cur.videoId || !cur.playing) return { ...cur, ...item, ext: false, dur: 0, playing: true, startAt: srvNow(), pos: 0 };
        const qq = [...(cur.queue || [])];
        if (qq.length >= QMAX) { toast('다음 곡은 ' + QMAX + '곡까지예요'); return null }
        qq.push(item); return { ...cur, queue: qq };
      });
      if (!ok) return; // 저장이 안 됐으면 "넣었어요"라고 하지 않음
      toast(swapped ? '막힌 영상이라 같은 노래의 다른 영상으로 넣었어요' : idle ? '바로 재생해요' : '다음 곡 목록에 넣었어요');
    };
  }
}

function loadImg(file) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file) }) }

  if (file.type === 'image/gif') {
    const gif = await readData(file);
    if (gif.length <= GIF_MSG_MAX) return gif;

  const img = await loadImg(file), max = 900, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));

function cropper(img) { // 끌어서 위치, 막대로 크기 맞추기
  return new Promise(resolve => {
    const F = 240, box = document.createElement('div'); box.className = 'crop';
    box.innerHTML = `<div class="crop-title">프로필 사진 맞추기</div><div class="crop-frame" id="cf"></div>
      <input type="range" id="cz" min="1" max="4" step="0.01" value="1" aria-label="확대">
      <div class="crop-btns"><button type="button" id="cx">취소</button><button type="button" id="ck">완료</button></div>
      <p class="crop-hint">사진을 끌어서 위치를, 막대로 크기를 맞춰요</p>`;
    $('.lcdwrap').appendChild(box);

    };

    frame.onpointerdown = e => { drag = { px: e.clientX, py: e.clientY, x, y }; frame.setPointerCapture(e.pointerId) };

    box.querySelector('#cx').onclick = () => close(null);
    box.querySelector('#ck').onclick = () => {
      const s = base * z, c = document.createElement('canvas'); c.width = c.height = 200;
      c.getContext('2d').drawImage(img, -x / s, -y / s, F / s, F / s, 0, 0, 200, 200);
      const w = img.naturalWidth * s, h = img.naturalHeight * s; // 움직이는 사진용: 잘라 낼 위치를 비율로 기억

    };
  });
}

const retryN = {};
let endAdv = null;
let player = null, playerReady = false, beat = null, lastVid = null, checkT = null;
const YT_ERR = { 2: '링크가 올바르지 않아요.', 5: '이 영상은 재생할 수 없어요.', 100: '삭제되었거나 비공개인 영상이에요.', 101: '이 영상은 다른 사이트에서 재생할 수 없게 막혀 있어요. 다른 링크(가사 영상, 음원만 있는 영상 등)를 써 보세요.', 150: '이 영상은 다른 사이트에서 재생할 수 없게 막혀 있어요. 다른 링크(가사 영상, 음원만 있는 영상 등)를 써 보세요.' };
function loadYT() {

    window.onYouTubeIframeAPIReady = () => { prev?.(); res() };

// 플레이어는 미리 준비해 두고, "같이 듣기"를 누르는 그 순간 바로 재생을 시작해야 브라우저가 소리를 허락해요
async function preparePlayer() {
  if (player) return;
  await loadYT();
  if (player) return;
  player = new YT.Player('yt', {
    width: '100%', height: '100%', playerVars: { playsinline: 1, rel: 0, origin: location.origin, widget_referrer: location.href },
    events: {
      onReady: () => { playerReady = true; lastVid = null; S.loadingYT = false; try { player.setVolume(S.vol) } catch { } if (S.joined && S.room?.playing) startNow(S.room.videoId, target(S.room)); else syncPlayer(); if (S.screen === 'music') render() },
      onStateChange: e => {

        if (e.data === YT.PlayerState.ENDED) {

          const r = S.room, vid = lastVid, dur = player.getDuration?.() || 0;

      onError: e => {
        S.ytErr = YT_ERR[e.data] || '재생할 수 없는 영상이에요.';
        const r = S.room, vid = lastVid;
        if (r && !r.ext && r.videoId === vid && [101, 150].includes(e.data)) {
          // 다른 사이트 재생이 막힌 곡: 같은 노래의 다른 영상을 찾아 바꿔 틀고, 없으면 유튜브에서 같이 듣기로
          S.ytErr = '';

        } else if (S.joined && r?.playing && !r.ext && r.videoId === vid && e.data === 100) {

        } else if (S.joined && r?.playing && !r.ext && r.videoId === vid && [5, 152, 153].includes(e.data)) {
          // 일시적인 오류: 넘기지 않고 같은 곡을 한 번 다시 불러옴. 그래도 안 되면 대신 틀 영상을 찾음
          retryN[vid] = (retryN[vid] || 0) + 1;
          if (retryN[vid] <= 1) { S.ytErr = ''; try { player.loadVideoById({ videoId: vid, startSeconds: target(r) }) } catch { } }

}
function startNow(videoId, t) { // 클릭한 순간에 바로 호출

// 기기마다 시계가 조금씩 달라서, 서버 시계에 맞춰 위치를 계산해요

    lastVid = r.videoId; S.ytErr = '';
    if (r.playing) player.loadVideoById({ videoId: r.videoId, startSeconds: t });
    else player.cueVideoById({ videoId: r.videoId, startSeconds: t });
    return;
  }
  const cur = player.getCurrentTime?.() || 0, st = player.getPlayerState?.(), dur = player.getDuration?.() || 0;
  // 재생 중일 때만, 5초 넘게 어긋났을 때만 위치를 맞춰요 (불러오는 중엔 건드리지 않음)
  if (r.playing && st === YT.PlayerState.PLAYING && Math.abs(cur - t) > 5 && (!dur || t < dur - 2)) player.seekTo(t, true);
  // 서버 시간으로 이미 끝났어야 하는 곡이면 다시 틀지 않고 다음 곡으로 (끝난 곡이 처음부터 반복되던 문제)
  if (r.playing && dur && t >= dur - 1) { if (endAdv !== r.videoId + r.startAt) { endAdv = r.videoId + r.startAt; advance(r.videoId) } return }
  if (r.playing && st === YT.PlayerState.ENDED) return;
  if (r.playing && st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) player.playVideo();
  if (!r.playing && st === YT.PlayerState.PLAYING) player.pauseVideo();
}
setInterval(() => { if (S.room?.playing && S.joined) syncPlayer() }, 10000);
// 방 정보는 항상 트랜잭션으로 바꿔서, 여러 사람이 동시에 눌러도 곡이 겹치거나 건너뛰지 않게 함
// 목록에 들어가는 곡 정보를 깔끔하게 정리 (빈 값이 섞이면 Firebase가 저장을 거부함)
const QMAX = 200; // 다음 곡 목록 최대 곡 수
function cleanItem(i) {
  const o = { videoId: String(i?.videoId || ''), title: String(i?.title || ''), by: String(i?.by || ''), pick: String(i?.pick || '') };
  if (i?.ext) { o.ext = true; o.dur = +i.dur || 0 }
  return o;
}
function roomTx(fn) {
  const ref = doc(db, 'room', 'main');
  return runTransaction(db, async tx => {
    const snap = await tx.get(ref), cur = snap.exists() ? snap.data() : {};
    const n = fn(cur); if (!n) return false;
    const keep = n.videoId === cur.videoId || n.alt; // 곡이 바뀌면 대체 영상 찾기 기록은 초기화
    tx.set(ref, {
      videoId: String(n.videoId || ''), title: String(n.title || ''), pick: String(n.pick || ''), playing: !!n.playing, ext: !!n.ext, dur: n.dur || 0,
      fix: keep ? (n.fix || '') : '', tried: keep ? (n.tried || []).slice(-6) : [],
      startAt: n.startAt ?? srvNow(), pos: n.pos ?? 0, queue: (n.queue || []).slice(0, QMAX).map(cleanItem),
      by: S.me.uid, at: serverTimestamp()
    });
    return true;
  }).catch(e => {
    console.warn('room save failed', e);
    toast(e?.code === 'permission-denied' ? '저장이 막혔어요. Firebase 보안 규칙을 최신으로 게시해 주세요' : (e?.code === 'resource-exhausted' ? '오늘 Firebase 무료 사용량을 다 썼어요. 오후 4~5시쯤 다시 채워져요' : '저장하지 못했어요 (' + (e?.code || e?.message || '알 수 없음') + ')'));
    return false;
  });
}
function advance(endedId) { // 곡이 끝나면(또는 NEXT) 다음 곡으로
  return roomTx(cur => {
    if (!cur.videoId) return null;
    if (endedId && (cur.videoId !== endedId || !cur.playing)) return null; // 이미 다른 사람이 넘김
    const qq = [...(cur.queue || [])], next = qq.shift();
    if (!next) return { ...cur, playing: false, pos: 0, queue: [] };
    return { ...cur, videoId: next.videoId, title: next.title, pick: next.pick, ext: !!next.ext, dur: next.dur || 0, playing: true, startAt: srvNow(), pos: 0, queue: qq };
  });
}
// 제목을 가져오면서, 다른 사이트 재생이 막힌 영상인지도 미리 확인 (막힌 영상은 유튜브가 401/403으로 답함)
async function ytInfo(id) {
  try {
    const r = await fetch(`https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v=${id}`);
    if (r.status === 401 || r.status === 403) return { blocked: true, title: '' };
    if (r.status === 404) return { missing: true, title: '' };
    if (r.ok) { const j = await r.json(); return { title: String(j.title || '').slice(0, 100) } }
  } catch { }
  try {
    const r = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`);
    if (r.ok) { const j = await r.json(); if (j.title) return { title: String(j.title).slice(0, 100) } }
  } catch { }
  return { title: '' };
}
function togglePlay() {
  const r = S.room; if (!r) return;
  if (r.playing) { try { player?.pauseVideo() } catch { } roomTx(cur => cur.playing ? { ...cur, playing: false, pos: target(cur) } : null) }
  else { startNow(r.videoId, r.pos || 0); roomTx(cur => cur.playing ? null : { ...cur, playing: true, startAt: srvNow() - (cur.pos || 0) * 1000 }) }
}
// 화면 켜두기: 휴대폰 화면이 꺼지면 재생이 멈추는 걸 막아 줌
let wakeLock = null;
async function toggleWake() {
  if (S.wake) { S.wake = false; try { await wakeLock?.release() } catch { } wakeLock = null; render(); return }
  try { wakeLock = await navigator.wakeLock.request('screen'); S.wake = true; toast('화면이 꺼지지 않게 해 둘게요') }
  catch { toast('이 브라우저는 화면 켜두기를 지원하지 않아요') }
  render();
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (S.wake) { try { wakeLock = await navigator.wakeLock.request('screen') } catch { } }
  syncPlayer(); // 돌아오면 다시 맞춤
});

// PC 작은 창: 곡이 바뀌면 창도 따라서 다음 곡으로 바꾸고, 사이트에서 재생되는 곡이 오면 창을 닫음
let ytPop = null, popVid = null;
function followPopup() {
  if (!ytPop) return;
  if (ytPop.closed) { ytPop = null; popVid = null; return }
  const r = S.room;
  if (!r?.videoId) return;
  if (!r.ext) return; // 사이트에서 재생되는 곡이면, 실제로 소리가 나기 시작할 때 창을 닫음
  if (r.playing && r.videoId !== popVid) {
    try { ytPop.location.href = `https://www.youtube.com/watch?v=${r.videoId}&t=${Math.floor(target(r))}s`; popVid = r.videoId } catch { }
  }
}
/* ----- 막힌 영상 대신 틀 영상 찾기 (YouTube Data API) ----- */
// Google Cloud에서 만든 API 키를 넣어 주세요. 비워 두면 이 기능은 꺼지고, 막힌 곡은 유튜브에서 열기로만 들어요.
const YT_KEY = 'AIzaSyAscu5JxdCJ6ALwX1D82dT6NR-m6IYm6Jo';
async function ytApi(path) {
  const r = await fetch(`https://www.googleapis.com/youtube/v3/${path}&key=${YT_KEY}`);
  if (!r.ok) throw new Error('api ' + r.status);
  return r.json();
}
async function findAltFor(vid, title, tried) {
  try {
    let q = title;
    if (!q) { const v = await ytApi(`videos?part=snippet&id=${vid}`); q = v.items?.[0]?.snippet?.title || '' }
    if (!q) return null;
    q = q.replace(/\[[^\]]*\]|\([^)]*(m\/?v|music video|official|뮤직비디오|teaser)[^)]*\)/gi, ' ').replace(/\s+/g, ' ').trim();
    // 다른 사이트에서도 재생되는 영상만 검색 (videoEmbeddable + videoSyndicated)
    const res = await ytApi(`search?part=snippet&type=video&maxResults=8&videoEmbeddable=true&videoSyndicated=true&q=${encodeURIComponent(q)}`);
    const items = (res.items || []).filter(i => i.id?.videoId && !tried.includes(i.id.videoId));
    if (!items.length) return null;
    const topic = items.find(i => /- Topic$/.test(i.snippet?.channelTitle || ''));
    const pick = topic || items.find(i => /lyric|가사|audio|오디오/i.test(i.snippet?.title || '')) || items[0];
    const dec = t => { const d = document.createElement('textarea'); d.innerHTML = t; return d.value };
    return { id: pick.id.videoId, title: title || dec(pick.snippet.title).slice(0, 100) };
  } catch { return null }
}
async function fixBlocked(vid) {
  // 한 사람만 찾도록 먼저 "내가 찾을게" 표시를 남김 (여러 명이 동시에 검색하지 않게)
  let mine = false;
  await roomTx(cur => {
    if (cur.videoId !== vid || cur.ext || cur.fix) return null;
    mine = true; return { ...cur, fix: S.me.uid, tried: [...(cur.tried || []), vid] };
  });
  if (!mine) return;
  const r = S.room, tried = [...(r?.tried || []), vid];
  const alt = YT_KEY && tried.length <= 4 ? await findAltFor(vid, r?.title || '', tried) : null;
  await roomTx(cur => {
    if (cur.videoId !== vid) return null;
    if (alt) return { ...cur, alt: true, videoId: alt.id, title: cur.title || alt.title, fix: '', tried: [...(cur.tried || []), vid], startAt: srvNow(), pos: 0 };
    // 끝까지 못 찾으면 멈춰 있지 않고 다음 곡으로
    const qq = [...(cur.queue || [])], next = qq.shift();
    if (!next) return { ...cur, fix: '', playing: false, pos: 0, queue: [] };
    return { ...cur, videoId: next.videoId, title: next.title, pick: next.pick, ext: !!next.ext, dur: next.dur || 0, playing: true, startAt: srvNow(), pos: 0, queue: qq };
  });
  toast(alt ? '막힌 영상이라 같은 노래의 다른 영상으로 바꿨어요' : '재생할 수 있는 영상을 못 찾아서 다음 곡으로 넘겼어요');
}
// 숨겨 둔 두 번째 플레이어(소리 끔)로 영상을 잠깐 틀어 봐서, 이 사이트에서 재생되는지 미리 확인
let probe = null, probeReady = null, probeCb = null, probeQ = Promise.resolve();
function getProbe() {
  if (probeReady) return probeReady;
  probeReady = loadYT().then(() => new Promise(res => {
    const d = document.createElement('div'); d.id = 'ytprobe'; $('#yt-box').appendChild(d);
    probe = new YT.Player('ytprobe', {
      width: '240', height: '200', playerVars: { playsinline: 1, mute: 1, rel: 0, origin: location.origin, widget_referrer: location.href },
      events: { onReady: () => res(probe), onStateChange: e => probeCb?.('state', e.data), onError: e => probeCb?.('error', e.data) }
    });
  }));
  return probeReady;
}
function testPlayable(id) {
  const run = async () => {
    let p; try { p = await getProbe() } catch { return 'unknown' }
    return new Promise(res => {
      let done = false;
      const fin = v => { if (done) return; done = true; probeCb = null; clearTimeout(to); try { p.stopVideo() } catch { } res(v) };
      probeCb = (k, v) => {
        if (k === 'error') fin([101, 150, 152, 153].includes(v) ? 'blocked' : v === 100 ? 'missing' : 'unknown');
        else if (v === YT.PlayerState.PLAYING) fin('ok');
      };
      const to = setTimeout(() => fin('unknown'), 7000); // 확인이 오래 걸리면 일단 넣고, 재생할 때 다시 확인
      try { p.mute(); p.loadVideoById(id) } catch { fin('unknown') }
    });
  };
  probeQ = probeQ.then(run, run);
  return probeQ;
}
// 음량: 내 기기에서만 바뀌고, 다음에 들어와도 기억해요
function setVol(v) {
  S.vol = Math.max(0, Math.min(100, v | 0));
  try { localStorage.setItem('wb_vol', S.vol) } catch { }
  const el = $('#volv'); if (el) el.textContent = S.vol;
  try { if (playerReady) { S.vol ? player.unMute() : player.mute(); player.setVolume(S.vol) } } catch { }
}
function fmtT(sec) { sec = Math.max(0, Math.floor(sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') }
function parseDur(v) {
  v = String(v).trim(); let m;
  if ((m = v.match(/^(\d{1,2})\s*[:：분.]\s*(\d{1,2})\s*초?$/))) { const s = +m[1] * 60 + +m[2]; return s >= 10 && s <= 1800 ? s : 0 }
  if ((m = v.match(/^(\d{2,4})$/))) { const s = +m[1]; return s >= 10 && s <= 1800 ? s : 0 }
  return 0;
}
// 유튜브에서 듣는 곡: 시간 표시하고, 곡 길이가 지나면 다음 곡으로
let extAdv = null;
setInterval(() => {
  const r = S.room;
  if (!r?.ext || !r.playing) return;
  const t = target(r), el = $('#extt');
  if (el) el.textContent = fmtT(t) + (r.dur ? ' / ' + fmtT(r.dur) : '');
  if (S.me && r.dur && t >= r.dur + 1 && extAdv !== r.videoId + r.startAt) { extAdv = r.videoId + r.startAt; advance(r.videoId) }
}, 1000);

/* ===== 새 버전 자동 적용 ===== */
// 사이트를 새로 올렸는데 휴대폰이 예전 화면을 기억하고 있으면, 알아서 새 버전으로 다시 불러옴
const BUILD = document.querySelector('meta[name="build"]')?.content || '';
async function checkUpdate(force) {
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/<meta name="build" content="([^"]+)"/);
    if (!m || !BUILD || m[1] === BUILD) return;
    let done = ''; try { done = sessionStorage.getItem('wb_reload') || '' } catch { }
    if (done === m[1]) return; // 같은 버전으로 두 번 다시 불러오지 않음
    const busy = S.screen === 'send' || S.editMsg || S.editReply || S.joined;
    if (busy && !force) { toast('새 버전이 있어요. 새로고침해 주세요'); return }
    try { sessionStorage.setItem('wb_reload', m[1]) } catch { }
    location.reload();
  } catch { }
}
checkUpdate(true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(false) });

/* ===== 공통 ===== */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.go, { owner: S.me?.uid }));
$('#homebtn').onclick = () => { if (S.me) go('home') };
function tick() { const d = new Date(); $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') }
tick(); setInterval(tick, 30000);
render();
</script>
