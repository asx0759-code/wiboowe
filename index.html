<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="build" content="20261111-1830">
<meta http-equiv="Cache-Control" content="no-cache">
<title>위시 부흥 위원회</title>
<link rel="apple-touch-icon" href="/icon/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="위시 부흥 위원회">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 29S3 21 3 11.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 3.5C29 21 16 29 16 29z%22 fill=%22%23000%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Poor+Story&display=swap">
<style>
@font-face{font-family:"MaruMinya JP";src:url("MaruMinya.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
/* Layout: one pink phone centered on a pastel sky; every screen lives inside its LCD, nav pinned to the bottom like a 2000s handset */
:root{
  --sky-a:#e9e8ec; --sky-b:#cfced6;
  --shell:#1c1b1f; --shell-hi:#4a4950; --shell-lo:#060608;
  --pink:#2b2a2f; --pink-deep:#111013; --pink-soft:#6b6a72;
  --lcd:#ffffff; --line:#dcdbe0; --ink:#1a191c; --muted:#85848c;
  --bar:#ececef; --sky-text:#3a393f; --tint:#f2f1f4; --rule:#e6e5ea; --acc:#c9c8cf;
  --pixel:"MaruMinya JP","DotGothic16","Courier New",monospace;
  --hand:"MaruMinya JP","Poor Story","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:radial-gradient(circle at 20% 15%,#fff 0 2px,transparent 3px) 0 0/90px 90px,
             radial-gradient(circle at 70% 60%,#fff 0 1.5px,transparent 2.5px) 0 0/120px 120px,
             linear-gradient(160deg,var(--sky-a),var(--sky-b));
  color:var(--ink);font-family:var(--hand);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.note{font-family:var(--pixel);font-size:12px;color:var(--sky-text);letter-spacing:.04em;text-align:center}
.phone{
  width:min(100%,380px);
  background:linear-gradient(145deg,var(--shell-hi),var(--shell) 40%,var(--shell-lo));
  border-radius:54px;padding:26px 16px 36px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -4px 10px rgba(0,0,0,.5),0 18px 40px rgba(20,20,30,.35);
}
.top{display:flex;justify-content:center;align-items:center;gap:22px;height:40px;margin-bottom:12px}
.speaker{width:96px;height:18px;border-radius:12px;background:#000;box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.2)}
.cam{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#556,#000)}
.lcd{
  background:var(--lcd);border:3px solid #000;border-radius:4px;
  height:560px;display:flex;flex-direction:column;overflow:hidden;
}
.status{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:linear-gradient(#f6f6f7,var(--bar));border-bottom:1px solid var(--line);font-family:var(--pixel);font-size:12px}
.status .icons{display:flex;gap:6px;align-items:center}
.bat{width:30px;height:12px;border:2px solid #222;border-radius:2px;position:relative;padding:1px}
.bat::after{content:"";position:absolute;right:-5px;top:2px;width:3px;height:5px;background:#222}
.bat i{display:block;height:100%;width:80%;background:linear-gradient(90deg,#3b2a8f,#e04aa8)}
.head{background:linear-gradient(var(--pink-soft),var(--pink) 55%,var(--pink-deep));color:#fff;text-align:center;font-family:var(--pixel);font-size:16px;padding:10px 40px;position:relative;text-shadow:0 1px 0 rgba(0,0,0,.6);min-height:24px}
.head button{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-family:var(--pixel);font-size:16px;cursor:pointer;padding:4px 8px}
.body{flex:1;overflow-y:auto;min-height:0}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(var(--pink-soft),var(--pink) 50%,var(--pink-deep))}
.nav button{background:none;border:0;color:#fff;font-family:var(--pixel);font-size:12px;padding:12px 0;cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.nav button.on{background:rgba(255,255,255,.28)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px dashed var(--pink-deep);outline-offset:2px}

/* list rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:2px solid var(--line);cursor:pointer;background:var(--lcd);width:100%;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit}
.row:hover{background:var(--tint)}
.num{flex:none;width:28px;height:28px;background:var(--pink);color:#fff;font-family:var(--pixel);font-size:12px;display:grid;place-items:center;box-shadow:inset -2px -2px 0 var(--pink-deep)}
.row svg{flex:none}
.ttl{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ttl.secret{color:var(--muted)}
.row .meta{font-family:var(--pixel);font-size:12px;color:var(--muted);flex:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:12px}

/* forms */
.form{padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--pixel);font-size:12px;color:var(--muted);letter-spacing:.06em}
.field input,.field textarea,.field select{font-family:var(--hand);font-size:12px;border:2px solid var(--line);background:#fff;padding:6px 10px;color:var(--ink);border-radius:0}
.field textarea{resize:none;height:130px;line-height:1.6;background:repeating-linear-gradient(#fff 0 26px,var(--rule) 26px 27px);background-attachment:local}
.count{font-family:var(--pixel);font-size:12px;color:var(--muted);text-align:right}
.btn{font-family:var(--pixel);font-size:12px;color:#fff;background:linear-gradient(var(--pink-soft),var(--pink) 55%,var(--pink-deep));border:0;padding:11px;cursor:pointer;box-shadow:0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line)}
.tabs button{font-family:var(--pixel);font-size:12px;background:#fff;border:0;padding:10px;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--pink-deep);box-shadow:inset 0 -3px 0 var(--pink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--pink)}
.seg button{font-family:var(--hand);font-size:12px;background:#fff;border:0;padding:6px;cursor:pointer;color:var(--pink-deep)}
.seg button.on{background:var(--pink);color:#fff}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.err{font-size:12px;color:var(--pink-deep);min-height:1em}

/* read */
.letter{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.from{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--acc);padding-bottom:6px;gap:8px}
.from b{font-size:14px}
.from span{font-family:var(--pixel);font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--pixel);font-size:12px;color:#fff;background:var(--pink-deep);padding:2px 6px;align-self:flex-start}
.chip.pub{background:var(--muted)}
.text{font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.reply{background:var(--tint);border-left:4px solid var(--pink);padding:8px 10px;font-size:12px;line-height:1.4}
.reply small{display:block;font-family:var(--pixel);font-size:12px;color:var(--pink-deep);margin-bottom:2px}
.reply-form{display:flex;gap:6px}
.reply-form input{flex:1;min-width:0;font-family:var(--hand);font-size:12px;border:2px solid var(--line);padding:4px 8px}
.reply-form button{font-family:var(--pixel);font-size:12px;background:var(--pink);color:#fff;border:0;padding:0 12px;cursor:pointer}

/* home */
.me{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:2px solid var(--line);background:linear-gradient(#fff,var(--tint))}
.av{width:52px;height:52px;background:var(--pink);border:2px solid var(--pink-deep);display:grid;place-items:center;font-family:var(--pixel);font-size:22px;color:#fff;flex:none}
.me b{font-size:14px;display:block}
.me span{font-family:var(--pixel);font-size:12px;color:var(--muted)}
.sect{font-family:var(--pixel);font-size:12px;color:var(--muted);padding:10px 14px 4px;letter-spacing:.06em}

/* music */
.now{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.disc{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#fff 0 10px,var(--pink-deep) 11px 14px,#2a2228 15px 60px,#3a3038 61px);animation:spin 6s linear infinite;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.track{font-size:18px}
.listeners{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.listeners span{font-family:var(--pixel);font-size:12px;background:var(--tint);color:var(--pink-deep);padding:3px 8px}

.homewrap{min-height:100%;display:flex;flex-direction:column}
.wallset{margin:6px 14px 0;padding:12px;border:1px solid var(--line);font-size:12px}
.wallset b{display:block;font-size:14px;margin-bottom:10px}
.wallrow{display:flex;gap:12px;align-items:center}
.wallrow>div{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.wallrow .out{padding:2px 0}
.wallprev{width:46px;height:82px;flex:none;border:1px solid var(--line);background:#000 center/cover no-repeat;display:grid;place-items:center;color:#888;font-size:11px}
.foot{margin-top:auto;padding:28px 14px 12px;text-align:center}
.out{background:none;border:0;font-family:var(--pixel);font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 10px}
.lp{position:relative;width:150px;height:150px;flex:none;border-radius:50%;background:repeating-radial-gradient(circle,#1b1a1e 0 2px,#2a292e 2px 4px);box-shadow:0 6px 16px rgba(0,0,0,.3);overflow:hidden;animation:spin 5s linear infinite;animation-play-state:paused}
.lp.on{animation-play-state:running}
.lp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;transform:scale(1.35)}
.lp::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--lcd);box-shadow:0 0 0 4px rgba(0,0,0,.55)}
.lp .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 0 30%,rgba(0,0,0,.18) 31%,transparent 33%,transparent 60%,rgba(255,255,255,.08) 61%,transparent 63%)}
.ctrl{display:flex;gap:8px;width:100%}
.ctrl input{flex:1;min-width:0;font-family:var(--hand);font-size:12px;border:2px solid var(--line);padding:6px 8px}
.ctrl button,.play{font-family:var(--pixel);font-size:12px;background:var(--pink);color:#fff;border:0;padding:0 12px;cursor:pointer}
.play{padding:8px 22px;font-size:12px;box-shadow:0 3px 0 #000}
@media (prefers-reduced-motion:reduce){.lp{animation:none}}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(34,32,36,.88);color:#fff;font-family:var(--pixel);font-size:12px;padding:8px 14px;white-space:nowrap}
.lcdwrap{position:relative}
.home-btn{width:54px;height:54px;border-radius:50%;margin:16px auto 0;background:linear-gradient(145deg,var(--shell-hi),var(--shell-lo));box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.2);border:0;display:block;cursor:pointer}


.av{overflow:hidden;padding:0;position:relative}
.av img,.mini img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.avbtn{cursor:pointer}
.cam-badge{position:absolute;right:0;bottom:0;width:16px;height:16px;background:#000;color:#fff;font-size:12px;line-height:16px;text-align:center;font-family:var(--pixel)}
.me > div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.mini{flex:none;position:relative;width:28px;height:28px;overflow:hidden;background:var(--tint);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--pixel);font-size:12px;color:var(--pink-deep)}
.who{display:flex;align-items:center;gap:8px;min-width:0}

.crop{position:absolute;inset:3px;z-index:20;background:rgba(10,10,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.crop-title{font-family:var(--pixel);color:#fff;font-size:12px}
.crop-frame{position:relative;width:240px;height:240px;flex:none;overflow:hidden;background:#000;touch-action:none;cursor:grab;outline:2px solid #fff}
.crop-frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 33.3% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 66.6% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 0 33.3%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 0 66.6%/100% 1px no-repeat}
.crop-img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
#cz{width:240px;accent-color:#fff}
.crop-btns{display:flex;gap:10px}
.crop-btns button{font-family:var(--pixel);font-size:12px;padding:8px 22px;border:2px solid #fff;background:none;color:#fff;cursor:pointer}
.crop-btns #ck{background:#fff;color:#000}
.crop-hint{font-family:var(--pixel);font-size:12px;color:#aaa;margin:0}
.attach{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.attach .out{padding:4px 0;font-size:12px}
#prev{display:flex;align-items:center;gap:8px}
#prev img{width:48px;height:48px;object-fit:cover;border:1px solid var(--line)}
.photo{border:1px solid var(--line);background:var(--tint);min-height:60px;display:grid;place-items:center}
.photo img{width:100%;display:block}
.photo span{font-family:var(--pixel);font-size:12px;color:var(--muted);padding:20px}

.ctrl-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.play.ghost{background:#fff;color:var(--pink-deep);box-shadow:0 3px 0 #000;border:2px solid var(--pink-deep)}
.qlist{width:100%;text-align:left;border-top:2px solid var(--line);padding-top:8px}
.qrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.qrow .num{width:22px;height:22px;font-size:12px}
.qt{flex:1;min-width:0;font-size:12px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qt small{display:block;font-family:var(--pixel);font-size:12px;color:var(--muted)}
.qrow .out{font-size:16px;text-decoration:none;padding:2px 8px}
.links{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:center}
.links .out{padding:4px 0}
.now .track{font-size:15px;line-height:1.4;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.now .track{font-size:15px}
.now .play{font-size:12px;padding:6px 18px}
.now .qrow .out{font-size:13px}
.now .ytopen{font-size:12px}
/* 미니 게임 */
.mg-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-family:var(--pixel);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mg-bar b{color:var(--ink);font-weight:400}
.mg-stage{position:relative;margin:0 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;background:#3b2a1f;border:2px solid #000;cursor:none}
.hole{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 50% 72%,#120c08 0 52%,#5a4130 53% 62%,transparent 63%);overflow:hidden;border:0;padding:0;cursor:none;-webkit-tap-highlight-color:transparent}
.mole{position:absolute;left:18%;right:18%;bottom:-90%;aspect-ratio:1;transition:bottom .12s ease-out}
.hole.up .mole{bottom:14%}
.mface{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:2px solid #000;background:#6b6a72;display:grid;place-items:center;font-family:var(--pixel);font-size:16px;color:#fff}
.mface img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.crown,.tear{position:absolute;display:none;pointer-events:none}
.crown{left:15%;right:15%;top:-30%}
.tear{width:20%;top:52%}
.tear.l{left:12%}.tear.r{right:12%}
.hole.k-c .crown,.hole.k-t .tear{display:block}
.hole.k-t .mface{filter:saturate(.55) brightness(.92)}
.hole.k-c .mface{border-color:#d99a1e;box-shadow:0 0 0 2px #f7c843}
.hole.hit .mole{transform:scale(.88)}
.hole.hit .mface{filter:brightness(1.5)}
.pow{position:absolute;left:50%;top:4%;transform:translateX(-50%);white-space:nowrap;font-family:var(--pixel);font-size:12px;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none}
.pow.p-c{color:#f7c843}.pow.p-t{color:#7cc4ff}
.mg-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(16,16,18,.78);color:#fff;text-align:center;font-family:var(--pixel);font-size:12px;padding:16px;line-height:1.6}
.mg-over[hidden]{display:none}
.mg-over big{font-size:16px}
.mg-btn{padding:9px 24px}
.mg-tabs{display:flex;gap:6px;padding:10px 12px 2px}
.mg-tabs button{flex:1;border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:12px;padding:7px 0;cursor:pointer}
.mg-tabs button.on{background:var(--ink);color:#fff;font-weight:700;border-color:transparent}
.gf{min-height:100%;background:#17161c center/cover no-repeat;display:flex}
.gf-in{flex:1;display:flex;flex-direction:column;align-items:center;padding:34px 18px 30px;background:rgba(14,13,20,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.gf h2{margin:0 0 18px;color:#fff;font-size:28px;font-weight:600;letter-spacing:-.01em;align-self:flex-start;padding-left:14px}
.gf-box{width:100%;max-width:360px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px;padding:26px 20px;border-radius:34px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.gf-box button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font:inherit;-webkit-tap-highlight-color:transparent}
.gf-box button:active .gf-ic{transform:scale(.92);filter:brightness(.88)}
.gf-ic{width:100%;max-width:78px;aspect-ratio:1;border-radius:23%;display:grid;place-items:center;box-shadow:inset 0 3px 2px rgba(255,255,255,.5),inset 0 -6px 9px rgba(0,0,0,.22),0 6px 10px rgba(0,0,0,.4);transition:transform .12s}
.gf-ic svg{width:66%;height:66%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.gf-box small{color:#fff;font-size:12px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.gf p{margin:16px 0 0;color:rgba(255,255,255,.55);font-size:12px}
.sd-table{margin:4px 10px 0;padding:18px 12px 20px;border-radius:18px;background:radial-gradient(ellipse at 50% 30%,#2f9a5f,#0d5230 75%);box-shadow:inset 0 0 0 5px #5a3414,inset 0 0 0 7px #8a5a2a,inset 0 0 40px rgba(0,0,0,.35);color:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.sd-title{font-family:var(--pixel);font-size:18px;color:#ffe9a8;margin-top:6px}
.sd-rule{margin:0;font-size:12.5px;line-height:1.7;color:#d7f2de}.sd-rule b{color:#ffe14a}.sd-rule small{color:#a9d6b6}
.sd-bets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.sd-bets button{aspect-ratio:1;border-radius:50%;border:4px dashed rgba(255,255,255,.75);background:#c81e2c;color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.sd-bets button:nth-child(2){background:#2456c8}.sd-bets button:nth-child(3){background:#1c1c22}.sd-bets button:nth-child(4){background:#c79a1a}

.hs{min-height:100%;display:flex;flex-direction:column;padding:16px 14px 10px}
.hs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{position:relative;aspect-ratio:1;width:100%;border-radius:22%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;overflow:visible;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.94);filter:brightness(.9)}
.tile.photo{border:0;min-height:0}
.tile.photo .appav{padding:0;width:100%;height:100%;border-radius:22%;overflow:hidden;position:relative;display:grid;place-items:center;background:#e9e8ec;font-family:var(--pixel);font-size:22px;color:var(--ink)}
.tile.photo .appav img{width:100%;height:100%;object-fit:cover;max-width:none}
.tile.light{background:linear-gradient(160deg,#fff,#e6e5ec)}
.w-cal{grid-column:1/3;grid-row:1/3;border-radius:16%/16%;background:linear-gradient(160deg,#2c2b31,#141417);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#fff;padding:12px 10px 8px;display:flex;flex-direction:column;gap:6px;aspect-ratio:1}
.w-cal b{font-family:var(--pixel);font-size:12px;font-weight:400;letter-spacing:.04em;padding-left:2px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center;font-family:var(--pixel);font-size:10px;line-height:15px;font-variant-numeric:tabular-nums}
.calg i{font-style:normal;color:#c9c8cf}
.calg .we{color:#7d7c84}
.calg .today{background:#fff;color:#000;border-radius:3px}
.calg .got{text-decoration:underline;text-underline-offset:2px}
.w-clock{background:none;cursor:default}
.w-clock:active{transform:none;filter:none}
.w-clock svg{width:100%;height:100%;border-radius:22%;background:#fff;font-family:Helvetica,Arial,sans-serif}
.folder{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);padding:14%;place-items:start}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8%;width:100%}
.fi{aspect-ratio:1;border-radius:24%;overflow:hidden;position:relative;background:#e9e8ec;display:grid;place-items:center;font-family:var(--pixel);font-size:8px;color:var(--ink)}
.fi img{width:100%;height:100%;object-fit:cover;max-width:none}
.fi svg{width:80%;height:80%}
.folder .fi:has(svg){background:#55545c}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3b30;color:#fff;font-family:var(--pixel);font-size:12px;line-height:20px;text-align:center;z-index:2}
.hs-dock{margin-top:auto;display:flex;justify-content:space-around;gap:14px;padding:12px;border-radius:26px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.dk svg{width:58%;height:58%}
.hs-dock .tile{width:calc((100% - 30px) / 4);flex:none}
.hs-adm{margin-top:auto;display:flex;justify-content:space-around;gap:14px;padding:0 12px 14px}
.hs-adm>*{width:calc((100% - 30px) / 4);flex:none}
.hs-adm+.hs-dock{margin-top:0}

.wt{background:#fff;color:#111}
/* 말랑한 3D 아이콘 */
.p3{color:#fff;background:linear-gradient(165deg,var(--l),var(--b) 70%);box-shadow:inset 0 3px 2px rgba(255,255,255,.55),inset 0 -6px 9px rgba(0,0,0,.22),0 6px 10px rgba(0,0,0,.45)}
.p3 .vi{width:56%;height:56%;--d:var(--b);filter:drop-shadow(0 3px 2px rgba(0,0,0,.28)) drop-shadow(0 -1px 0 rgba(255,255,255,.5))}
.p3f{box-shadow:inset 0 3px 2px rgba(255,255,255,.55),inset 0 -6px 9px rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.45);border-radius:22%}
.tile.photo.p3f .appav{box-shadow:none}
.w-clock.p3f svg{box-shadow:inset 0 0 0 3px #fff}
.c-game{--l:#b48cff;--b:#6c3ef0}
.c-friends{--l:#ffffff;--b:#dcdbe3;color:#8b93a7}
.c-friends .vi{filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.c-admin{--l:#5a6b8f;--b:#263252}
.c-now{--l:#ffe14a;--b:#ff7a1a;color:#fff}
.c-now .vi{width:70%;height:70%;object-fit:contain;--d:var(--b);filter:drop-shadow(0 2px 2px rgba(150,50,0,.45))}
/* NOW (잭디 스타일) */
.body.nowbg{background:#0b0b0d;color:#e8e8ea}
.nw-top{display:flex;align-items:center;gap:8px;padding:10px 8px 8px}
.nw-me{display:flex;align-items:center;gap:8px;min-width:0;flex:1;background:#1b1b20;border:0;border-radius:999px;padding:4px 12px 4px 4px;color:#ddd;font:inherit;font-size:12px;cursor:pointer;text-align:left}
.nw-me .mini{width:26px;height:26px;border-radius:50%;border:0}
.nw-me .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw-me i,.nw-msg i{color:#777;font-style:normal}
.nw-seg{display:flex;background:#1b1b20;border-radius:999px;padding:3px;flex:none}
.nw-seg button{border:0;background:none;color:#8a8a92;font:inherit;font-size:11px;padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.nw-seg button.on{background:#ffb020;color:#111;font-weight:700}
.nw-lab{font-size:11px;color:#8a8a92;padding:2px 10px 6px}
.nw-taps{display:flex;gap:10px;overflow-x:auto;padding:0 10px 10px;scrollbar-width:none}
.nw-tp{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:#bbb;font:inherit;flex:none}
.nw-tp .mini{width:40px;height:40px;border-radius:50%;border:2px solid #ffb020}
.nw-tp small{font-size:10px;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.nw-cell{position:relative;aspect-ratio:1;border:0;padding:0;background:#16161a;overflow:hidden;cursor:pointer;display:block;font:inherit}
.nw-cell:active{filter:brightness(.8)}
.nw-ph{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;font-size:30px;color:#5a5a62;background:linear-gradient(160deg,#2a2a31,#141417)}
.nw-ph img{width:100%;height:100%;object-fit:cover;max-width:none;display:block}
.nw-cell.off .nw-ph{filter:grayscale(.55) brightness(.62)}
.nw-cap{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.88));text-align:left;display:flex;flex-direction:column;gap:1px}
.nw-cap b{color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.nw-cap small{color:#a9a9b0;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:#55555c;font-style:normal}
.dot.on{background:#3bff7a;box-shadow:0 0 6px #3bff7a}
.dot.music{background:#ff4f8b;box-shadow:0 0 6px #ff4f8b}
.dot.game{background:#b48cff;box-shadow:0 0 6px #b48cff}
.nw-cell.me::after{content:"ME";position:absolute;top:5px;left:5px;font-size:9px;font-weight:700;background:#ffb020;color:#111;padding:1px 5px;border-radius:4px}
.nw-pk{position:absolute;top:4px;right:5px;font-size:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.nw-sheet{position:absolute;inset:3px;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;animation:nwf .15s}
.nw-card{width:100%;background:#121215;color:#eee;border-radius:18px 18px 0 0;overflow:hidden auto;max-height:94%;animation:nwu .22s ease-out}
.nw-big{position:relative;aspect-ratio:1;background:#1a1a1f}
.nw-big .nw-ph{font-size:72px}
.nw-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:14px;cursor:pointer;z-index:2}
.nw-info{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.nw-info b{font-size:18px;color:#fff;display:block}
.nw-info span{font-size:12px;color:#bbb;display:flex;align-items:center;gap:6px;margin-top:3px}
.nw-msg{padding:14px 14px 2px;font-size:13px;color:#ddd;line-height:1.5;word-break:break-all}
.nw-acts{display:flex;gap:8px;padding:12px 14px 16px}
.nw-acts button,.nw-edit button{flex:1;border:0;border-radius:12px;padding:11px 0;font:inherit;font-size:12px;cursor:pointer;background:#24242a;color:#eee}
.nw-acts .pk,.nw-edit button{background:#ffb020;color:#111;font-weight:700}
.nw-acts button:disabled{opacity:.6}
.nw-edit{display:flex;gap:8px;padding:14px}
.nw-edit input{flex:1;min-width:0;background:#1d1d22;border:1px solid #2e2e35;border-radius:12px;color:#fff;font:inherit;font-size:16px;padding:9px 12px}
.nw-edit button{flex:none;padding:0 18px}
.nw-edit button.gray{background:#2a2a31;color:#ddd;font-weight:400;padding:0 12px}
.nw-music{padding:8px 14px 0}
.nw-nm{display:flex;align-items:center;gap:8px;min-width:0}
.nw-nm b{flex:none}
.nw-sp{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:5px;min-width:0;max-width:46%;height:24px;padding:0 9px 0 3px;border:0;border-radius:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font:inherit;font-size:11px;cursor:pointer}
.nw-sp i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#ff8a1f;display:grid;place-items:center;font-size:8px;flex:none}
.nw-sp img{width:18px;height:18px;border-radius:50%;object-fit:cover;flex:none}
.nw-sp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw-sp.on img{animation:nwspin 3s linear infinite}
@keyframes nwspin{to{transform:rotate(360deg)}}
.nw-yt{position:absolute;width:1px;height:1px;left:-9px;top:-9px;opacity:0;pointer-events:none;border:0}
.nw-music .ytwrap{border-radius:14px;overflow:hidden;margin:0}
.nw-song{position:absolute;bottom:34px;right:5px;width:18px;height:18px;border-radius:50%;background:rgba(255,138,31,.9);color:#fff;font-size:11px;line-height:18px;text-align:center}
.head .hd-r{left:auto;right:6px;font-size:12px;display:flex;align-items:center;gap:4px}
.hd-n{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#ff3b30;color:#fff;font-size:10px;line-height:16px;text-align:center}
.nw-cnt{position:absolute;top:5px;right:5px;font-size:9px;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:1px 4px}
.nw-cnt~.nw-pk{top:18px}
.nw-bars{position:absolute;top:8px;left:10px;right:48px;display:flex;gap:4px;z-index:2}
.nw-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.nw-bars i.on{background:#fff}
.nw-big{cursor:pointer}
.nw-pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px 0}
.nw-slot{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#1d1d22;border:1px dashed #3a3a42;padding:0}
.nw-slot img{width:100%;height:100%;object-fit:cover;display:block}
.nw-slot.add{color:#ffb020;font-size:26px;cursor:pointer;font-family:inherit}
.nw-slot.add:disabled{opacity:.3;cursor:default}
.nw-slot [data-rm]{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;cursor:pointer}
.nw-slot .fst{position:absolute;left:4px;bottom:4px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font:inherit;font-size:10px;padding:2px 6px;cursor:pointer}
.nw-slot .fst.on{background:#ffb020;color:#111;font-weight:700}
.nd-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid #1e1e23;background:none;color:#eee;font:inherit;text-align:left;cursor:pointer}
.nd-row .mini{width:44px;height:44px;border-radius:50%;border:0}
.nd-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nd-t b{font-size:13px}
.nd-t small{color:#999;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd-m{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.nd-m small{color:#777;font-size:10px}
.nd-m i{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff7a1a;color:#fff;font-size:10px;line-height:18px;text-align:center}
.nc{min-height:100%;display:flex;flex-direction:column}
.nc-list{flex:1;display:flex;flex-direction:column;gap:8px;padding:12px 10px}
.nc-b{max-width:78%;display:flex;flex-direction:column;gap:2px}
.nc-b p{margin:0;padding:8px 12px;border-radius:16px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-all}
.nc-b small{font-size:10px;color:#777}
.nc-b.l{align-self:flex-start}.nc-b.l p{background:#24242a;color:#eee;border-bottom-left-radius:4px}
.nc-b.r{align-self:flex-end;align-items:flex-end}.nc-b.r p{background:linear-gradient(160deg,#ffd23f,#ff8a1f);color:#1a1000;border-bottom-right-radius:4px}
.nc-bar{position:sticky;bottom:0;display:flex;gap:8px;padding:8px 10px;background:#0b0b0d;border-top:1px solid #1e1e23}
.nc-bar input{flex:1;min-width:0;background:#1d1d22;border:1px solid #2e2e35;border-radius:18px;color:#fff;font:inherit;font-size:16px;padding:8px 14px}
.nc-bar button{border:0;border-radius:18px;background:#ff8a1f;color:#fff;font:inherit;font-size:12px;font-weight:700;padding:0 16px;cursor:pointer}
.adm-nc{background:#0b0b0d;border-radius:8px;margin:0 10px 12px}
.adm-pair{padding:8px 12px;font-size:12px}
.adm-pair small{color:var(--muted)}

.an-ban{margin:10px 10px 0;padding:10px 12px;border-radius:14px;background:#17171b;border:1px solid #2a2a31;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#ccc;line-height:1.5}
.an-ban b{color:#ffb020}
.an-warn{color:#ff8a1f;font-weight:700}
.an-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.an-acts button{border:0;border-radius:10px;background:#26262d;color:#eee;font:inherit;font-size:11px;padding:7px 10px;cursor:pointer}
.an-acts button.hot{background:#ff8a1f;color:#fff;font-weight:700}
.an-acts button:disabled{opacity:.5}
.an-acts input{flex:1;min-width:0;background:#1d1d22;border:1px solid #2e2e35;border-radius:10px;color:#fff;font:inherit;font-size:16px;padding:5px 10px}
.nc-anon{flex:none;border:1px solid #3a3a42;border-radius:18px;background:none;color:#aaa;font:inherit;font-size:11px;padding:0 10px;cursor:pointer;white-space:nowrap}
.nc-anon.on{background:#2a1f10;border-color:#ff8a1f;color:#ffb020}
.nc-anon:disabled{opacity:.4}
.nc-bar input:disabled{opacity:.5}
.nc-bar button:disabled{opacity:.4}
.an-q{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(160deg,hsl(var(--h) 80% 62%),hsl(calc(var(--h) + 40) 70% 42%))}
.nd-tag{font-size:10px;font-weight:400;color:#ffb020;background:#2a1f10;border-radius:5px;padding:1px 5px;margin-left:2px}
/* 친구들 (피드) */
.body.feedbg{background:#0b0b0d;color:#e8e8ea}
.fd{min-height:100%;display:flex;flex-direction:column}
.fd-tabs{display:flex;position:sticky;top:0;z-index:3;background:rgba(11,11,13,.94);border-bottom:1px solid #1f1f25}
.fd-tabs button{flex:1;border:0;background:none;color:#8a8a92;font:inherit;font-size:13px;padding:11px 0;cursor:pointer;position:relative}
.fd-tabs button.on{color:#fff;font-weight:700}
.fd-tabs button.on::after{content:"";position:absolute;left:35%;right:35%;bottom:0;height:3px;border-radius:2px;background:#ff4f8b}
.fd-tabs i{font-style:normal;margin-left:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#ff3b30;color:#fff;font-size:10px;line-height:16px;display:inline-block}
.st-row{display:flex;gap:12px;overflow-x:auto;padding:12px 10px 10px;border-bottom:1px solid #1f1f25;scrollbar-width:none}
.st-bub{flex:none;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#bbb;font:inherit}
.st-bub small{font-size:10px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-ring{position:relative;width:54px;height:54px;border-radius:50%;padding:2.5px;background:#3a3a42}
.st-ring.new{background:conic-gradient(#ffd23f,#ff8a1f,#ff4f8b,#ffd23f)}
.st-ring.none{background:#26262c}
.st-ring .mini{width:100%;height:100%;border-radius:50%;border:2.5px solid #0b0b0d}
.st-ring i{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#ff4f8b;color:#fff;font-style:normal;font-size:15px;line-height:18px;text-align:center;border:2px solid #0b0b0d}
.fd-compose{display:flex;align-items:center;gap:10px;margin:0;padding:12px;border:0;border-bottom:1px solid #1f1f25;background:none;color:#888;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.fd-compose .mini{width:34px;height:34px;border-radius:50%;border:0}
.fd-compose span:nth-child(2){flex:1}
.fd-compose b{background:#ff4f8b;color:#fff;border-radius:16px;padding:6px 14px;font-size:12px}
.tw{display:flex;gap:10px;padding:12px;border-bottom:1px solid #1f1f25;cursor:pointer}
.tw.big{cursor:default}
.tw-av{width:38px;height:38px;border-radius:50%;border:0;flex:none;cursor:pointer}
.tw-b{flex:1;min-width:0}
.tw-h{display:flex;align-items:center;gap:5px;font-size:13px}
.tw-h b{color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-h small{color:#777;font-size:11px;white-space:nowrap}
.tw-x{margin-left:auto;border:0;background:none;color:#777;font:inherit;font-size:11px;cursor:pointer;padding:2px 4px}
.tw-t{margin-top:4px;font-size:13px;line-height:1.55;color:#e8e8ea;white-space:pre-wrap;word-break:break-all}
.tw.big .tw-t{font-size:15px}
.men{color:#ff7aa8;font-weight:700;cursor:pointer}
.tw-im{display:grid;gap:3px;margin-top:8px;border-radius:14px;overflow:hidden}
.tw-im.n2,.tw-im.n4{grid-template-columns:1fr 1fr}
.tw-im.n3{grid-template-columns:1fr 1fr}.tw-im.n3 img:first-child{grid-row:span 2}
.tw-im img{width:100%;height:100%;max-height:260px;object-fit:cover;display:block;cursor:zoom-in;aspect-ratio:1}
.tw-im.n1 img{aspect-ratio:auto;max-height:320px}
.tw-q{margin-top:8px;border:1px solid #2a2a31;border-radius:14px;padding:8px 10px;cursor:pointer}
.tw-q .mini{width:18px;height:18px;border-radius:50%;border:0}
.tw-q.gone{color:#777;font-size:12px;cursor:default}
.tw-qi{color:#888;font-size:11px;margin-top:4px}
.tw-a{display:flex;gap:4px;margin-top:8px}
.tw-t a{color:#6fb7ff;word-break:break-all}
.tw .ytwrap{margin-top:8px;border-radius:14px;overflow:hidden}
.tw-a button{flex:1;border:0;background:none;color:#888;font:inherit;font-size:12px;text-align:left;cursor:pointer;padding:3px 0}
.tw-a button.on{color:#ff4f8b}
.tw-a .rt{width:15px;height:15px;vertical-align:-3px;color:#fff}
.fd-sect{padding:10px 12px 6px;font-size:12px;color:#8a8a92;border-bottom:1px solid #1f1f25}
.tw-c{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #1a1a1f}
.tw-c .mini{width:30px;height:30px;border-radius:50%;border:0;flex:none;cursor:pointer}
.tw-c>div{flex:1;min-width:0;font-size:12px}
.tw-c b{color:#fff;cursor:pointer}.tw-c em{font-style:normal;color:#777;font-size:10px;margin-left:5px}
.tw-c p{margin:3px 0 0;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.tw-c .tw-x{float:right}
.fd-fr{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid #1f1f25;background:none;color:#eee;font:inherit;text-align:left;cursor:pointer}
.fd-frb{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0;min-width:0}
.fd-fr .mini{width:42px;height:42px;border-radius:50%;border:0}

    }).join('') : `<div class="empty">아직 받은 메시지가 없어요</div>`)
      + (mine ? '' : `<div class="form"><button class="btn" id="write">${esc(S.users[owner] || '')}에게 남기기</button></div>`);
    v.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
      if (b.dataset.locked) { toast('주인과 보낸 사람만 볼 수 있어요'); return }

  }

  if (S.screen === 'read') {
    const m = msgsOf(S.owner).find(x => x.id === S.open), c = m && content(m);
    back('Message');
    $('#back').onclick = () => go('inbox');
    if (!m || !c) { v.innerHTML = '<div class="empty">메시지를 찾을 수 없어요</div>'; return }
    const isOwner = m.to === S.me.uid, canDel = isOwner || sentByMe(m);
    if (m.hasImage && !S.imgs[m.id]) {
      S.imgs[m.id] = 'loading';
      getDoc(doc(db, 'messages', m.id, 'media', 'image')).then(d => { S.imgs[m.id] = d.exists() ? d.data().data : null; if (S.screen === 'read') render() }).catch(() => { S.imgs[m.id] = null });
    }
    if (isOwner && !m.read) updateDoc(doc(db, 'messages', m.id), { read: true }).catch(() => { });

    v.innerHTML = `<div class="letter">

      <span class="chip ${m.secret ? '' : 'pub'}">${m.bc ? '전체 쪽지' : m.secret ? 'SECRET' : 'PUBLIC'}</span>
      ${c.item ? `<div class="itembox">${pix(c.item, 108)}<b>${esc((ITEMS[c.item] || {}).name || c.title)}</b><span>${m.anon ? '누군가가' : esc(c.fromNick) + '님이'} 보낸 선물이에요</span></div>` : ''}

      ${S.editMsg ? `<form class="form" id="ef" style="padding:0">
          ${c.item ? `<div class="field"><label for="eb">NOTE</label><input id="eb" maxlength="100" placeholder="같이 보낼 한마디 (없어도 돼요)" value="${esc(c.body)}"></div>`
            : `<div class="field"><label for="et">TITLE</label><input id="et" maxlength="20" value="${esc(c.title)}"></div>
          <div class="field"><label for="eb">MESSAGE</label><textarea id="eb" maxlength="300">${esc(c.body)}</textarea></div>`}
          <div class="err" id="err"></div>
          <div class="ctrl-row"><button type="button" class="play ghost" id="ecancel">CANCEL</button><button class="play">SAVE</button></div>
        </form>`
        : c.item ? (c.body ? `<div class="text">${linkify(c.body)}</div>${ytCards(c.body)}` : '') : `<div class="mtitle">${esc(c.title)}</div><div class="text">${linkify(c.body)}</div>${ytCards(c.body)}`}
      ${c.reply && !S.editReply ? `<div class="reply"><small>RE. ${esc(S.users[m.to] || '')}<span class="rtime">${c.replyAt ? fmt(c.replyAt) : ''}</span>${isOwner ? ' · <button class="out inline" id="redit">edit</button>' : ''}</small>${esc(c.reply)}</div>` : ''}
      ${isOwner && (!c.reply || S.editReply) && !S.editMsg ? `<form class="reply-form" id="rf"><input id="rt" maxlength="100" placeholder="답장 쓰기 (100자)" value="${S.editReply ? esc(c.reply) : ''}"><button>${S.editReply ? 'OK' : 'RE'}</button>${S.editReply ? '<button type="button" id="rcancel" class="ghostbtn">×</button>' : ''}</form>${S.editReply ? '<p class="hint">비우고 OK를 누르면 답장이 지워져요.</p>' : ''}` : ''}
      ${sentByMe(m) && m.anon && !S.editMsg ? (S.confirmReveal
          ? `<div class="reveal"><p class="hint">익명을 풀면 받는 사람과 친구들에게 내 닉네임이 보여요. 다시 익명으로는 돌릴 수 없어요.</p><div class="ctrl-row"><button type="button" class="play ghost" id="rvno">취소</button><button type="button" class="play" id="rvok">닉네임 공개하기</button></div></div>`
          : `<label class="anon"><input type="checkbox" id="anonT" checked> 익명으로 보냄</label>`) : ''}
      ${sentByMe(m) && !S.editMsg ? `<div class="foot" style="padding:8px 0 0;margin:0"><button class="out" id="medit">${c.item ? 'edit note' : 'edit message'}</button></div>` : ''}
      ${canDel ? `<div class="foot" style="padding-top:8px"><button class="out" id="del">${S.confirmDel ? '한 번 더 누르면 삭제돼요' : 'delete'}</button></div>` : ''}
    </div>`;
    if ($('#rf')) $('#rf').onsubmit = async e => {
      e.preventDefault(); const t = $('#rt').value.trim(); if (!t && !S.editReply) return;
      const ref = m.secret ? doc(db, 'messages', m.id, 'private', 'content') : doc(db, 'messages', m.id);
      try { await updateDoc(ref, { reply: t, replyAt: serverTimestamp() }); toast(S.editReply ? '답장을 고쳤어요' : '답장을 남겼어요'); S.editReply = false; render() } catch { toast('답장을 저장하지 못했어요') }
    };
    if ($('#redit')) $('#redit').onclick = () => { S.editReply = true; render(); $('#rt')?.focus() };
    if ($('#rcancel')) $('#rcancel').onclick = () => { S.editReply = false; render() };

    if ($('#anonT')) $('#anonT').onchange = e => { if (!e.target.checked) { S.confirmReveal = true; render() } };
    if ($('#rvno')) $('#rvno').onclick = () => { S.confirmReveal = false; render() };
    if ($('#rvok')) $('#rvok').onclick = async () => { // 익명 → 닉네임 공개
      const b = writeBatch(db);
      b.update(doc(db, 'messages', m.id), { from: S.me.uid, anon: false, ...(m.secret ? {} : { fromNick: S.me.nick }) });
      if (m.secret) b.update(doc(db, 'messages', m.id, 'private', 'content'), { from: S.me.uid, fromNick: S.me.nick });
      if (m.hasImage) b.update(doc(db, 'messages', m.id, 'media', 'image'), { from: S.me.uid });
      try {
        await b.commit();
        if (localAnon[m.id]) { delete localAnon[m.id]; try { localStorage.setItem('wb_anon', JSON.stringify(localAnon)) } catch { } }
        if (m.secret && S.priv[m.id] && S.priv[m.id] !== 'loading') S.priv[m.id] = { ...S.priv[m.id], from: S.me.uid, fromNick: S.me.nick };
        S.confirmReveal = false; toast('닉네임으로 바꿨어요'); render();
      } catch (err) { console.warn(err); toast('바꾸지 못했어요 (' + (err?.code || '') + ')') }
    };
    if ($('#ecancel')) $('#ecancel').onclick = () => { S.editMsg = false; render() };
    if ($('#ef')) $('#ef').onsubmit = async e => {
      e.preventDefault();
      const title = $('#et') ? $('#et').value.trim() : c.title, body = $('#eb').value.trim();
      if (!title || (!body && !c.item)) { $('#err').textContent = '제목과 내용을 모두 적어 주세요.'; return }
      const ref = m.secret ? doc(db, 'messages', m.id, 'private', 'content') : doc(db, 'messages', m.id);
      try {
        await updateDoc(ref, { title, body, editedAt: serverTimestamp() });
        if (localAnon[m.id]) saveLocalAnon(m.id, { ...localAnon[m.id], title, body });
        if (m.secret && S.priv[m.id] && S.priv[m.id] !== 'loading') S.priv[m.id] = { ...S.priv[m.id], title, body };
        S.editMsg = false; toast(c.item ? '한마디를 고쳤어요' : '메시지를 고쳤어요'); render();
      }
      catch { $('#err').textContent = '저장하지 못했어요. 잠시 후 다시 해 주세요.' }
    };
    if ($('#del')) $('#del').onclick = async () => {
      if (!S.confirmDel) { S.confirmDel = true; render(); return }
      const b = writeBatch(db);
      if (m.secret) b.delete(doc(db, 'messages', m.id, 'private', 'content'));
      if (m.hasImage) b.delete(doc(db, 'messages', m.id, 'media', 'image'));
      b.delete(doc(db, 'messages', m.id));

    };

  if (S.screen === 'send') {
    back('New Message'); if (S.to) $('#back').onclick = () => go('prof', { prof: S.to });
    const others = Object.entries(S.users).filter(([u]) => u !== S.me.uid);
    if (!others.length) { v.innerHTML = '<div class="empty">메시지를 보낼 친구가 아직 없어요</div>'; return }
    const isAll = S.to === '__all__';

    const kind = S.kind || 'msg', D = S.draft || {};
    v.innerHTML = `<form class="form" id="sf">
      <div class="seg" role="group" aria-label="보낼 것"><button type="button" data-k="msg" class="${kind === 'msg' ? 'on' : ''}">메시지</button><button type="button" data-k="item" class="${kind === 'item' ? 'on' : ''}">아이템</button></div>
      <div class="field"><label for="to">TO</label><select id="to"><option value="__all__" ${isAll ? 'selected' : ''}>모두에게 (전체 쪽지 · ${others.length}명)</option>${others.map(([u, n]) => `<option value="${u}" ${u === to ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
      ${kind === 'msg' ? `
      <div class="field"><label for="st">TITLE</label><input id="st" maxlength="20" placeholder="제목 (20자)" value="${esc(D.title || '')}"></div>
      <div class="field"><label for="sb">MESSAGE</label><textarea id="sb" maxlength="300" placeholder="메시지를 적어 주세요">${esc(D.body || '')}</textarea><div class="count" id="cnt">${(D.body || '').length}/300</div><div id="ytprev" class="ytprev">${ytThumbs(D.body || '')}</div></div>
      ${isAll ? '' : `<div class="attach"><button type="button" class="out" id="addimg">+ 사진 첨부</button><span id="prev"></span></div>
      <input type="file" id="imgfile" accept="image/*" hidden>`}` : `
      <div class="field"><label>ITEM</label><div class="items">${Object.entries(ITEMS).filter(([, it]) => !it.hidden).map(([k, it]) => `<button type="button" class="itbtn ${S.item === k ? 'on' : ''}" data-it="${k}" aria-pressed="${S.item === k}">${pix(k, 36)}<span class="itname">${esc(it.name).replace(' ', '\n')}</span></button>`).join('')}</div></div>
      <div class="field"><label for="sn">NOTE</label><input id="sn" maxlength="100" placeholder="같이 보낼 한마디 (없어도 돼요)" value="${esc(D.note || '')}"></div>`}
      <div class="seg" role="group" aria-label="공개 범위"><button type="button" data-v="pub" class="${S.vis === 'pub' ? 'on' : ''}">공개</button><button type="button" data-v="sec" class="${S.vis === 'sec' ? 'on' : ''}">비밀</button></div>
      <label class="anon"><input type="checkbox" id="anon" ${S.anon ? 'checked' : ''}> 익명으로 보내기</label>
      <p class="hint" id="vh"></p>
      <div class="err" id="err"></div>
      <button class="btn" type="submit">SEND ${kind === 'item' ? 'ITEM' : '✉'}</button>
    </form>`;
    const hint = () => $('#vh').textContent = (isAll ? `친구 ${others.length}명 모두의 INBOX에 한 통씩 가요. ` + (S.vis === 'sec' ? '비밀로 보내면 각자 받은 사람만 볼 수 있어요.' : '공개로 보내면 각자의 방명록에 들른 친구도 볼 수 있어요.') : S.vis === 'sec' ? '비밀로 보내면 받는 사람과 나만 볼 수 있어요.' : '공개로 보내면 방명록에 들른 친구 누구나 볼 수 있어요.')
      + (S.anon ? ' 받는 사람에게 보낸 사람이 "익명"으로 보여요.' : '');
    hint();
    const saveDraft = () => { S.draft = { title: $('#st')?.value ?? D.title, body: $('#sb')?.value ?? D.body, note: $('#sn')?.value ?? D.note } };
    v.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { saveDraft(); S.to = $('#to').value; S.kind = b.dataset.k; render() });
    v.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { S.item = b.dataset.it; v.querySelectorAll('[data-it]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b) }) });
    $('#anon').onchange = e => { S.anon = e.target.checked; hint() };
    if ($('#sb')) $('#sb').oninput = e => { $('#cnt').textContent = e.target.value.length + '/300'; $('#ytprev').innerHTML = ytThumbs(e.target.value) };
    $('#to').onchange = e => { const was = S.to === '__all__', now = e.target.value === '__all__'; S.to = e.target.value; if (was !== now) { saveDraft(); render() } };
    const showPrev = () => { if (!$('#prev')) return; $('#prev').innerHTML = S.attach ? `<img src="${S.attach}" alt=""><button type="button" class="out" id="rmimg">빼기</button>` : ''; if ($('#rmimg')) $('#rmimg').onclick = () => { S.attach = null; showPrev() } };
    showPrev();
    if ($('#addimg')) $('#addimg').onclick = () => $('#imgfile').click();
    if ($('#imgfile')) $('#imgfile').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { S.attach = await shrink(f); showPrev() } catch { toast('사진을 불러오지 못했어요') } };
    v.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { S.vis = b.dataset.v; v.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); hint() });
    $('#sf').onsubmit = async e => {
      e.preventDefault();
      const dest = $('#to').value, secret = S.vis === 'sec', anon = $('#anon').checked;
      let title, body, item = null;
      if (kind === 'item') {
        if (!S.item || !ITEMS[S.item]) { $('#err').textContent = '보낼 아이템을 골라 주세요.'; return }

      } else {
        title = $('#st').value.trim(); body = $('#sb').value.trim();
        if (!title || !body) { $('#err').textContent = '제목과 내용을 모두 적어 주세요.'; return }
      }
      const all = dest === '__all__', dests = all ? others.map(([u]) => u) : [dest];
      const sec = secret, from = anon ? '' : S.me.uid, withImg = !all && kind === 'msg' && !!S.attach;
      const text = { fromNick: anon ? '익명' : S.me.nick, title, body, reply: '', ...(item ? { item } : {}) };
      const sent = [];
      const put = (b, to) => { // 한 사람 몫의 메시지를 묶음에 넣기
        const ref = doc(collection(db, 'messages'));
        const base = { to, from, secret: sec, read: false, createdAt: serverTimestamp(), hasImage: withImg, kind, ...(anon ? { anon: true } : {}), ...(all ? { bc: true } : {}) };
        if (anon) b.set(doc(ref, 'meta', 'sender'), { uid: S.me.uid });
        if (sec) { b.set(ref, base); b.set(doc(ref, 'private', 'content'), { to, from, ...text }) }
        else b.set(ref, { ...base, ...text });
        if (withImg) b.set(doc(ref, 'media', 'image'), { to, from, secret: sec, data: S.attach });
        sent.push({ id: ref.id, to });
      };
      const step = anon ? 3 : 5; // 보안 규칙 검사 한도 때문에 몇 명씩 나눠 보냄
      const btn = $('#sf button[type="submit"]'); if (btn) btn.disabled = true;
      try {
        for (let i = 0; i < dests.length; i += step) {

          await b.commit();
          if (all) $('#err').textContent = `보내는 중… ${Math.min(dests.length, i + step)}/${dests.length}`;
        }
        if (anon) sent.forEach(x => { saveLocalAnon(x.id, { to: x.to, from: '', ...text }); anonChk[x.id] = true; if (sec) S.priv[x.id] = localAnon[x.id] });
        toast(all ? `${dests.length}명 모두에게 ${item ? ITEMS[item].name + '을(를) ' : ''}보냈어요` : S.users[dest] + '에게 ' + (item ? ITEMS[item].name + '을(를) ' : '') + '보냈어요');
        go('inbox', { owner: all ? S.me.uid : dest, to: null, vis: 'pub', attach: null, draft: null, item: null, anon: false });
      } catch (err) {
        console.warn(err); if (btn) btn.disabled = false;
        $('#err').textContent = (all && sent.length ? `일부만 보내고 멈췄어요 ` : '보내지 못했어요 ') + '(' + (err?.code || '') + '). 잠시 후 다시 해 주세요.';
      }
    };
    return;
  }

  if (S.screen === 'admin') {
    const A = S.adm || {}, tab = S.admTab || 'all', U = S.admUser;
    back(U ? esc(S.users[U] || '(탈퇴)') : 'Admin');
    $('#back').onclick = () => U ? go('admin', { admUser: null }) : (S.admPair || S.admAn) ? go('admin', { admPair: null, admAn: null, admDel: null }) : go('home');
    const nm = u => esc(S.users[u] || '(탈퇴)');
    const who = m => m.anon ? (A.sender?.[m.id] ? nm(A.sender[m.id]) + '(익명)' : '익명') : nm(m.from);
    const listAll = A.list || [];
    const rows = list => list.length ? list.map((m, i) => {
      const c = m.secret ? A.priv[m.id] : m;
      return `<button class="row" data-aid="${m.id}"><span class="num">${i + 1}</span><span class="ic">${c?.item ? pix(c.item, 24) : m.secret ? LOCK : ENV_O}</span><span class="ttl">${m.bc ? '<span class="bc">전체</span>' : ''}${c ? esc(c.title) : '(내용 없음)'}<small class="adm-who">${who(m)} → ${nm(m.to)} · ${fmt(m.createdAt)}</small></span>${m.hasImage ? '<span class="meta">IMG</span>' : ''}</button>`;
    }).join('') : '<div class="empty">메시지가 없어요</div>';
    let body;
    if (A.loading) body = '<div class="empty">불러오는 중…</div>';
    else if (A.err) body = `<div class="empty">${esc(A.err)}</div>`;
    else if (U) { // 한 사람의 방명록
      const list = listAll.filter(m => m.to === U);
      body = `<div class="me"><div class="av">${avatar(U)}</div><div><b>${nm(U)}의 방명록</b><span>${list.length} MSG · 비밀 ${list.filter(m => m.secret).length}</span></div></div>` + rows(list);
    } else if (tab === 'users') { // 방명록 목록
      const users = Object.entries(S.users).sort((a, b) => a[1].localeCompare(b[1]));
      body = users.map(([u, n], i) => {
        const cnt = listAll.filter(m => m.to === u).length;
        return `<button class="row" data-u="${u}"><span class="num">${i + 1}</span><span class="mini">${avatar(u)}</span><span class="ttl">${esc(n)}의 방명록</span><span class="meta">${cnt}</span></button>`;
      }).join('') || '<div class="empty">회원이 없어요</div>';
    } else if (tab === 'board') { // 게시판 관리
      const AB = S.admB || {};
      body = AB.loading ? '<div class="empty">불러오는 중…</div>' : AB.err ? `<div class="empty">${esc(AB.err)}</div>`

      ${mine || S.isAdmin ? `<div class="links" style="justify-content:flex-end">${mine ? '<button class="out" id="pedit">edit</button>' : ''}<button class="out" id="pdel">${S.confirmDel ? '한 번 더 누르면 삭제돼요' : 'delete'}</button></div>` : ''}
      <div class="sect" style="padding:6px 0 0">COMMENTS · ${cs.length}</div>
      <div class="cmts">${(() => {
        const label = c => c.op ? '글쓴이' : '익명' + c.n;
        const one = (c, sub) => {
          const me = (c.op && mine) || (!c.op && B.alias[p.id] === c.n);
          return `<div class="cmt ${c.op ? 'op' : ''} ${sub ? 'sub' : ''}"><div class="cmeta"><b>${sub ? '<span class="arrow">↳</span>' : ''}${label(c)}${me ? ' (나)' : ''}${real(c.op ? R.author : R.names?.[c.n])}</b><span>${fmt(c.at)}</span><span class="cact">${sub ? '' : `<button class="out inline" data-crep="${c.id}">답글</button>`}${me || S.isAdmin ? `<button class="out inline" data-cdel="${c.id}" aria-label="댓글 삭제">×</button>` : ''}</span></div><div class="ctext">${linkify(c.body)}</div></div>`;
        };
        const ids = new Set(cs.map(c => c.id));
        const tops = cs.filter(c => !c.p || !ids.has(c.p)); // 원댓글이 지워진 답글은 맨 위 줄로
        return tops.map(c => one(c, !!c.p) + cs.filter(r => r.p === c.id).map(r => one(r, true)).join('')).join('') || '<p class="hint" style="margin:4px 0">첫 댓글을 남겨 보세요.</p>';
      })()}</div>
      ${S.replyTo && cs.some(c => c.id === S.replyTo) ? `<div class="replying">${(c => c.op ? '글쓴이' : '익명' + c.n)(cs.find(c => c.id === S.replyTo))}에게 답글 다는 중 <button class="out inline" id="rcan">취소</button></div>` : ''}
      <form class="ctrl" id="cf"><input id="cmt" maxlength="300" autocomplete="off" placeholder="${S.replyTo ? '익명으로 답글 달기' : '익명으로 댓글 달기'}"><button>RE</button></form>
    </div>`;
    if (keep) { const el = $('#cmt'); el.value = keep.v; if (keep.f) el.focus() }
    if ($('#pedit')) $('#pedit').onclick = () => go('board-write', { editPost: p.id });
    if ($('#pdel')) $('#pdel').onclick = async () => {
      if (!S.confirmDel) { S.confirmDel = true; render(); return }
      try { await deletePost(p.id); toast('글을 지웠어요'); S.postFrom === 'admin' ? (go('admin', { admTab: 'board', postFrom: null }), loadAdminBoard()) : go('board') } catch (err) { console.warn(err); toast('지우지 못했어요 (' + (err?.code || '') + ')') }
    };
    v.querySelectorAll('[data-crep]').forEach(bt => bt.onclick = () => { S.replyTo = bt.dataset.crep; render(); $('#cmt')?.focus() });
    if ($('#rcan')) $('#rcan').onclick = () => { S.replyTo = null; render() };
    v.querySelectorAll('[data-cdel]').forEach(bt => bt.onclick = async () => {
      const b = writeBatch(db); b.delete(doc(db, 'posts', p.id, 'comments', bt.dataset.cdel)); b.update(doc(db, 'posts', p.id), { cc: increment(-1) });
      try { await b.commit(); toast('댓글을 지웠어요') } catch (err) { console.warn(err); toast('지우지 못했어요 (' + (err?.code || '') + ')') }
    });
    $('#cf').onsubmit = async e => {
      e.preventDefault();
      const el = $('#cmt'), t = el.value.trim(); if (!t) return;
      el.value = '';
      const parent = S.replyTo && (B.comments[p.id] || []).some(c => c.id === S.replyTo) ? S.replyTo : null;
      try { await addComment(p.id, t, parent); S.replyTo = null; render() } catch (err) { console.warn(err); el.value = t; toast('댓글을 남기지 못했어요 (' + (err?.code || '') + ')') }
    };
    return;
  }

  if (S.screen === 'music') {
    back('Listen Together');
    // 다시 그려도 쓰던 글자와 커서가 지워지지 않게
    const keepIn = ['yturl'].map(id => { const el = $('#' + id); return el ? { id, v: el.value, f: document.activeElement === el, p: el.selectionStart } : null }).filter(Boolean);
    const r = S.room, t = r?.videoId, now = srvNow(), q = r?.queue || [];
    const live = S.listeners.filter(l => now - ms(l.at) < 200000);
    v.innerHTML = `<div class="now">
      <div class="lp ${r?.playing ? 'on' : ''}" aria-hidden="true">${t ? `<img src="https://i.ytimg.com/vi/${t}/hqdefault.jpg" alt="">` : ''}<div class="ring"></div></div>
      <div class="track">${!t ? '아직 곡이 없어요' : esc(r.title || (r.playing ? '같이 듣는 중' : '일시정지'))}</div>
      ${t ? `<div class="hint">${r.playing ? '▶ 재생 중' : '❚❚ 일시정지'}${r.pick ? ' · ' + esc(r.pick) + '님이 고른 곡' : ''}</div>` : ''}
      ${r?.ext ? `<a class="play ytopen" id="ytopen" href="https://www.youtube.com/watch?v=${t}" target="_blank" rel="noopener">▶ 유튜브에서 열기</a>
        <p class="hint"><span id="extt">${fmtT(target(r))}${r.dur ? ' / ' + fmtT(r.dur) : ''}</span><br>사이트 안에서는 재생이 막힌 곡이라 유튜브에서 들어요.${r.dur ? '' : '<br>다 들으면 NEXT를 눌러 주세요.'}<br>버튼을 누르면 지금 위치부터 열려요. PC에서는 LP판 위에 작은 창으로 떠요.</p>` : ''}
      <div class="ctrl-row">
        ${!S.joined ? `<button class="play" id="join">♪ 같이 듣기</button>`
          : t ? `<button class="play" id="play">${r.playing ? '❚❚ PAUSE' : '▶ PLAY'}</button><button class="play ghost" id="skip">NEXT ▶▶</button>` : ''}
      </div>
      ${S.joined ? `<div class="vol"><span aria-hidden="true">VOL</span><input type="range" id="vol" min="0" max="100" step="1" value="${S.vol}" aria-label="음량"><span id="volv">${S.vol}</span></div>` : ''}
      <form class="ctrl" id="yt"><input id="yturl" placeholder="유튜브 링크로 곡 추가"><button>ADD</button></form>
      <div class="err" id="err">${esc(S.ytErr || '')}</div>
      ${S.extPending ? `<form class="extform" id="xf">
          <p class="hint">이 영상은 사이트 안에서 재생이 막혀 있어요.<br>대신 "유튜브에서 같이 듣기"로 넣을 수 있어요. 차례가 오면 유튜브에서 열고, 곡 길이만큼 지나면 다음 곡으로 넘어가요.</p>
          <input id="xt" maxlength="60" placeholder="곡 제목 (예: 아이유 - 밤편지)" value="${esc(S.extPending.title)}">
          <input id="xd" inputmode="numeric" placeholder="곡 길이 (예: 3:45)">
          <div class="err" id="xerr"></div>
          <div class="ctrl-row"><button type="button" class="play ghost" id="xc">취소</button><button class="play">넣기</button></div>
        </form>` : ''}
      ${S.loadingYT && S.joined ? '<p class="hint">플레이어를 준비하는 중이에요…</p>' : ''}
      ${S.needTap ? '<p class="hint">브라우저가 소리를 막았어요. 아래 영상의 재생 버튼을 한 번 직접 눌러 주세요.</p>' : ''}
      <div class="qlist">
        <div class="sect" style="padding:0 0 4px">NEXT UP · ${q.length}</div>
        ${q.length ? q.map((it, i) => `<div class="qrow"><span class="num">${i + 1}</span><span class="qt">${esc(it.title || '제목을 불러오지 못한 곡')}<small>${esc(it.pick || '')}</small></span>${it.by === S.me.uid ? `<button class="out" data-rm="${i}" aria-label="빼기">×</button>` : ''}</div>`).join('')
          : '<p class="hint">다음 곡이 없어요. 링크를 추가하면 지금 곡이 끝난 뒤에 이어서 나와요.</p>'}
      </div>
      <div class="links">
        ${S.joined ? `<button class="out" id="vid">${S.showVideo ? '영상 숨기기' : '영상 보기'}</button>
        <button class="out" id="wake">${S.wake ? '화면 켜두기 끄기' : '화면 켜두기'}</button>
        <button class="out" id="leave">그만 듣기</button>` : ''}
      </div>
      <div class="sect" style="padding:0">LISTENING NOW · ${live.length}</div>
      <div class="listeners">${live.map(l => `<span>${esc(l.nick)}${l.uid === S.me.uid ? ' (나)' : ''}</span>`).join('') || '<span>아무도 없어요</span>'}</div>
    </div>`;
    v.querySelectorAll('.lp img').forEach(i => i.onerror = () => i.remove());
    keepIn.forEach(k => { const el = $('#' + k.id); if (!el) return; el.value = k.v; if (k.f) { el.focus(); try { el.setSelectionRange(k.p, k.p) } catch { } } });
    if ($('#join')) $('#join').onclick = joinRoom;
    if ($('#leave')) $('#leave').onclick = () => { leaveRoom(); render() };
    if ($('#vid')) $('#vid').onclick = () => { S.showVideo = !S.showVideo; $('#yt-box').classList.toggle('show', S.showVideo); render() };
    if ($('#wake')) $('#wake').onclick = toggleWake;
    if ($('#vol')) $('#vol').oninput = e => setVol(+e.target.value);
    if ($('#play')) $('#play').onclick = togglePlay;
    if ($('#skip')) $('#skip').onclick = () => advance(null);
    if ($('#ytopen')) $('#ytopen').onclick = e => {
      const rr = S.room; if (!rr?.ext) return;
      const url = `https://www.youtube.com/watch?v=${rr.videoId}&t=${Math.floor(target(rr))}s`;
      e.currentTarget.href = url;
      // PC: 사이트 옆에 작은 창으로 띄움 / 휴대폰: 새 탭이나 유튜브 앱 (브라우저가 작은 창을 지원하지 않음)
      const pc = matchMedia('(pointer:fine)').matches && screen.width > 800;
      if (!pc) return;
      // LP판이 화면 어디에 있는지 계산해서, 작은 창의 가운데가 LP판 가운데에 오게 함
      const w = 420, h = 320, lp = document.querySelector('.lp')?.getBoundingClientRect();
      const chromeX = Math.max(0, (window.outerWidth - window.innerWidth) / 2), chromeY = Math.max(0, window.outerHeight - window.innerHeight - chromeX);
      const cx = lp ? (window.screenX || 0) + chromeX + lp.left + lp.width / 2 : (window.screenX || 0) + window.outerWidth / 2;
      const cy = lp ? (window.screenY || 0) + chromeY + lp.top + lp.height / 2 : (window.screenY || 0) + window.outerHeight / 2;
      const left = Math.max(0, Math.round(cx - w / 2)), top = Math.max(0, Math.round(cy - h / 2));
      const pop = window.open(url, 'wiboowe_yt', `popup=yes,width=${w},height=${h},left=${left},top=${top}`);
      if (pop) { e.preventDefault(); ytPop = pop; popVid = rr.videoId; try { pop.focus() } catch { } }
    };
    if ($('#xc')) $('#xc').onclick = () => { S.extPending = null; render() };
    if ($('#xf')) $('#xf').onsubmit = async e => {
      e.preventDefault();
      const id = S.extPending.id, title = $('#xt').value.trim(), dur = parseDur($('#xd').value);
      if (!title) { $('#xerr').textContent = '곡 제목을 적어 주세요.'; return }
      if (!dur) { $('#xerr').textContent = '곡 길이를 3:45처럼 적어 주세요.'; return }
      const item = { videoId: id, title, by: S.me.uid, pick: S.me.nick, ext: true, dur };
      let now = false;
      await roomTx(cur => {
        if (!cur.videoId || !cur.playing) { now = true; return { ...cur, ...item, playing: true, startAt: srvNow(), pos: 0 } }
        const qq = [...(cur.queue || [])];
        if (qq.length >= QMAX) { toast('다음 곡은 ' + QMAX + '곡까지예요'); return null }
        qq.push(item); return { ...cur, queue: qq };
      });
      S.extPending = null; toast(now ? '지금 곡이에요. 유튜브에서 열어 주세요' : '다음 곡 목록에 넣었어요'); render();
    };
    v.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => roomTx(cur => {
      const qq = [...(cur.queue || [])], k = +b.dataset.rm;
      if (qq[k]?.by !== S.me.uid) return null;
      qq.splice(k, 1); return { ...cur, queue: qq };
    }));
    $('#yt').onsubmit = async e => {
      e.preventDefault();
      const u = $('#yturl').value.trim();
      const m = u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/) || u.match(/^([\w-]{11})$/);
      if (!m) { $('#err').textContent = '유튜브 링크를 확인해 주세요.'; return }
      const id = m[1]; S.ytErr = '';
      if (!S.joined) { S.joined = true; heartbeat(); clearInterval(beat); beat = setInterval(heartbeat, 90000) }
      $('#yturl').value = '';
      $('#err').textContent = '재생되는 영상인지 확인하는 중이에요…';
      // 넣기 전에 미리 확인: 막힌 영상이면 처음부터 대신 틀 영상으로 넣음
      const [info, test] = await Promise.all([ytInfo(id), testPlayable(id)]);
      $('#err').textContent = '';
      if (info.missing || test === 'missing') { S.ytErr = '없거나 비공개인 영상이에요.'; render(); return }
      let vid = id, title = info.title, swapped = false;
      if (info.blocked || test === 'blocked') {
        $('#err').textContent = '막힌 영상이라 같은 노래의 다른 영상을 찾는 중이에요…';
        let alt = null;
        if (YT_KEY) {
          const tried = [id];
          for (let k = 0; k < 3 && !alt; k++) { // 찾은 영상도 미리 확인해서, 되는 것만 넣음
            const cand = await findAltFor(id, title, tried);
            if (!cand) break;
            tried.push(cand.id);
            if ((await testPlayable(cand.id)) !== 'blocked') alt = cand;
          }
        }
        $('#err').textContent = '';
        if (!alt) { S.ytErr = '이 노래는 재생할 수 있는 영상을 찾지 못해서 넣지 않았어요.'; render(); return }
        vid = alt.id; title = title || alt.title; swapped = true;
      }
      const idle = !S.room?.videoId || !S.room.playing;
      if (idle) startNow(vid, 0);
      const item = { videoId: vid, title, by: S.me.uid, pick: S.me.nick };
      const ok = await roomTx(cur => {
        if (!cur.videoId || !cur.playing) return { ...cur, ...item, ext: false, dur: 0, playing: true, startAt: srvNow(), pos: 0 };
        const qq = [...(cur.queue || [])];
        if (qq.length >= QMAX) { toast('다음 곡은 ' + QMAX + '곡까지예요'); return null }
        qq.push(item); return { ...cur, queue: qq };
      });
      if (!ok) return; // 저장이 안 됐으면 "넣었어요"라고 하지 않음
      toast(swapped ? '막힌 영상이라 같은 노래의 다른 영상으로 넣었어요' : idle ? '바로 재생해요' : '다음 곡 목록에 넣었어요');
    };
  }
}

function ytIdsIn(t) {

  let m; while ((m = re.exec(String(t || ''))) && out.length < 3) if (!out.includes(m[1])) out.push(m[1]);

}

}

const ytTitleCache = {};
function fillYtTitles() {
  document.querySelectorAll('.ytt[data-id]').forEach(el => {

    if (!list.length) { if (++ui < order.length) { si = 0; show() } else close(); return }
    if (si === 0 && who !== S.me.uid) { const f = list.findIndex(s => !seenStory(s.id)); if (f > 0) si = f }
    const s = list[si], mine = who === S.me.uid;
    markStory(s.id);

        resume();
      };
    } else {
      const ri = box.querySelector('#st-reply');
      ri.onfocus = pause; ri.onblur = resume;

    const mine = rank(...st.my); let w = 0, t = 0; deck.forEach(n => { const d = rank(st.dl[0], n); if (mine > d) w++; else if (mine === d) t++ });

  }

function loadImg(file) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file) }) }

function cropper(img, o = {}) { // 끌어서 위치, 막대로 크기 맞추기 (o.fw/o.fh: 틀 크기, 기본 정사각형)

    const F = o.fw || 240, FH = o.fh || F, box = document.createElement('div'); box.className = 'crop';
    box.innerHTML = `<div class="crop-title">${o.title || '프로필 사진 맞추기'}</div><div class="crop-frame" id="cf"></div>
      <input type="range" id="cz" min="1" max="4" step="0.01" value="1" aria-label="확대">
      <div class="crop-btns"><button type="button" id="cx">취소</button><button type="button" id="ck">완료</button></div>
      <p class="crop-hint">사진을 끌어서 위치를, 막대로 크기를 맞춰요</p>`;

    };
  });
}

// 플레이어는 미리 준비해 두고, "같이 듣기"를 누르는 그 순간 바로 재생을 시작해야 브라우저가 소리를 허락해요
async function preparePlayer() {

    events: {
      onReady: () => { playerReady = true; lastVid = null; S.loadingYT = false; try { player.setVolume(S.vol) } catch { } if (S.joined && S.room?.playing) startNow(S.room.videoId, target(S.room)); else syncPlayer(); if (S.screen === 'music') render() },
      onStateChange: e => {

        if (e.data === YT.PlayerState.ENDED) {
          // 내 플레이어에서 끝난 곡이 '지금 곡'과 같고, 서버 시간으로도 정말 끝날 때가 됐을 때만 넘김
          const r = S.room, vid = lastVid, dur = player.getDuration?.() || 0;
          if (S.joined && r?.playing && !r.ext && r.videoId === vid && (!dur || target(r) >= dur - 5)) advance(vid);
        }

      onError: e => {
        S.ytErr = YT_ERR[e.data] || '재생할 수 없는 영상이에요.';
        const r = S.room, vid = lastVid;
        if (r && !r.ext && r.videoId === vid && [101, 150].includes(e.data)) {
          // 다른 사이트 재생이 막힌 곡: 같은 노래의 다른 영상을 찾아 바꿔 틀고, 없으면 유튜브에서 같이 듣기로
          S.ytErr = '';

        } else if (S.joined && r?.playing && !r.ext && r.videoId === vid && e.data === 100) {

        } else if (S.joined && r?.playing && !r.ext && r.videoId === vid && [5, 152, 153].includes(e.data)) {
          // 일시적인 오류: 넘기지 않고 같은 곡을 한 번 다시 불러옴. 그래도 안 되면 대신 틀 영상을 찾음
          retryN[vid] = (retryN[vid] || 0) + 1;
          if (retryN[vid] <= 1) { S.ytErr = ''; try { player.loadVideoById({ videoId: vid, startSeconds: target(r) }) } catch { } }
