async function measureClock(keep) {
  if (!S.me) return;
  const ref = doc(db, 'room', 'main', 'listeners', S.me.uid);
  try {
    const t0 = Date.now();
    await setDoc(ref, { nick: S.me.nick, at: serverTimestamp() });
    const t1 = Date.now(), d = await getDoc(ref), at = d.data()?.at;
    if (at?.toMillis && t1 - t0 < 3000) {
      const off = at.toMillis() - (t0 + t1) / 2;
      clockOff = clockN ? clockOff * 0.7 + off * 0.3 : off; clockN++;
    }
    if (!keep && !S.joined) await deleteDoc(ref);
  } catch { }
}
let beatN = 0;
function heartbeat() { // 90초마다 '듣는 중' 표시. 시계 맞추기(읽기 1번 더)는 6번에 1번만
  if (!S.me || !S.joined) return;
  if (beatN++ % 6 === 0) measureClock(true);
  else setDoc(doc(db, 'room', 'main', 'listeners', S.me.uid), { nick: S.me.nick, at: serverTimestamp() }).catch(() => { });
}
function leaveRoom() {
  clearInterval(beat); beat = null; clearTimeout(checkT);
  if (S.wake) { S.wake = false; try { wakeLock?.release() } catch { } wakeLock = null }
  if (S.joined && S.me) deleteDoc(doc(db, 'room', 'main', 'listeners', S.me.uid)).catch(() => { });
  S.joined = false; S.showVideo = false; S.needTap = false; $('#yt-box')?.classList.remove('show');
  try { player?.pauseVideo() } catch { }
}
addEventListener('pagehide', leaveRoom);
function target(r) { return r.playing ? Math.max(0, (srvNow() - r.startAt) / 1000) : (r.pos || 0) }
function syncPlayer() {
  const r = S.room;
  if (!player || !playerReady || !r?.videoId) return;
  if (r.ext) { try { if (player.getPlayerState?.() === YT.PlayerState.PLAYING) player.pauseVideo() } catch { } return }
  const t = target(r);
  if (!S.joined) { // 듣기 전에는 곡만 준비
    if (r.videoId !== lastVid) { lastVid = r.videoId; player.cueVideoById({ videoId: r.videoId, startSeconds: t }) }
    return;
  }
  if (r.videoId !== lastVid) {
    lastVid = r.videoId; S.ytErr = '';
    if (r.playing) player.loadVideoById({ videoId: r.videoId, startSeconds: t });
    else player.cueVideoById({ videoId: r.videoId, startSeconds: t });
    return;
  }
  const cur = player.getCurrentTime?.() || 0, st = player.getPlayerState?.(), dur = player.getDuration?.() || 0;
  // 재생 중일 때만, 5초 넘게 어긋났을 때만 위치를 맞춰요 (불러오는 중엔 건드리지 않음)
  if (r.playing && st === YT.PlayerState.PLAYING && Math.abs(cur - t) > 5 && (!dur || t < dur - 2)) player.seekTo(t, true);
  // 서버 시간으로 이미 끝났어야 하는 곡이면 다시 틀지 않고 다음 곡으로 (끝난 곡이 처음부터 반복되던 문제)
  if (r.playing && dur && t >= dur - 1) { if (endAdv !== r.videoId + r.startAt) { endAdv = r.videoId + r.startAt; advance(r.videoId) } return }
  if (r.playing && st === YT.PlayerState.ENDED) return;
  if (r.playing && st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) player.playVideo();
  if (!r.playing && st === YT.PlayerState.PLAYING) player.pauseVideo();
}
setInterval(() => { if (S.room?.playing && S.joined) syncPlayer() }, 10000);
// 방 정보는 항상 트랜잭션으로 바꿔서, 여러 사람이 동시에 눌러도 곡이 겹치거나 건너뛰지 않게 함
// 목록에 들어가는 곡 정보를 깔끔하게 정리 (빈 값이 섞이면 Firebase가 저장을 거부함)
const QMAX = 200; // 다음 곡 목록 최대 곡 수
function cleanItem(i) {
  const o = { videoId: String(i?.videoId || ''), title: String(i?.title || ''), by: String(i?.by || ''), pick: String(i?.pick || '') };
  if (i?.ext) { o.ext = true; o.dur = +i.dur || 0 }
  return o;
}
function roomTx(fn) {
  const ref = doc(db, 'room', 'main');
  return runTransaction(db, async tx => {
    const snap = await tx.get(ref), cur = snap.exists() ? snap.data() : {};
    const n = fn(cur); if (!n) return false;
    const keep = n.videoId === cur.videoId || n.alt; // 곡이 바뀌면 대체 영상 찾기 기록은 초기화
    tx.set(ref, {
      videoId: String(n.videoId || ''), title: String(n.title || ''), pick: String(n.pick || ''), playing: !!n.playing, ext: !!n.ext, dur: n.dur || 0,
      fix: keep ? (n.fix || '') : '', tried: keep ? (n.tried || []).slice(-6) : [],
      startAt: n.startAt ?? srvNow(), pos: n.pos ?? 0, queue: (n.queue || []).slice(0, QMAX).map(cleanItem),
      by: S.me.uid, at: serverTimestamp()
    });
    return true;
  }).catch(e => {
    console.warn('room save failed', e);
    toast(e?.code === 'permission-denied' ? '저장이 막혔어요. Firebase 보안 규칙을 최신으로 게시해 주세요' : (e?.code === 'resource-exhausted' ? '오늘 Firebase 무료 사용량을 다 썼어요. 오후 4~5시쯤 다시 채워져요' : '저장하지 못했어요 (' + (e?.code || e?.message || '알 수 없음') + ')'));
    return false;
  });
}
function advance(endedId) { // 곡이 끝나면(또는 NEXT) 다음 곡으로
  return roomTx(cur => {
    if (!cur.videoId) return null;
    if (endedId && (cur.videoId !== endedId || !cur.playing)) return null; // 이미 다른 사람이 넘김
    const qq = [...(cur.queue || [])], next = qq.shift();
    if (!next) return { ...cur, playing: false, pos: 0, queue: [] };
    return { ...cur, videoId: next.videoId, title: next.title, pick: next.pick, ext: !!next.ext, dur: next.dur || 0, playing: true, startAt: srvNow(), pos: 0, queue: qq };
  });
}
// 제목을 가져오면서, 다른 사이트 재생이 막힌 영상인지도 미리 확인 (막힌 영상은 유튜브가 401/403으로 답함)
async function ytInfo(id) {
  try {
    const r = await fetch(`https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v=${id}`);
    if (r.status === 401 || r.status === 403) return { blocked: true, title: '' };
    if (r.status === 404) return { missing: true, title: '' };
    if (r.ok) { const j = await r.json(); return { title: String(j.title || '').slice(0, 100) } }
  } catch { }
  try {
    const r = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`);
    if (r.ok) { const j = await r.json(); if (j.title) return { title: String(j.title).slice(0, 100) } }
  } catch { }
  return { title: '' };
}
function togglePlay() {
  const r = S.room; if (!r) return;
  if (r.playing) { try { player?.pauseVideo() } catch { } roomTx(cur => cur.playing ? { ...cur, playing: false, pos: target(cur) } : null) }
  else { startNow(r.videoId, r.pos || 0); roomTx(cur => cur.playing ? null : { ...cur, playing: true, startAt: srvNow() - (cur.pos || 0) * 1000 }) }
}
// 화면 켜두기: 휴대폰 화면이 꺼지면 재생이 멈추는 걸 막아 줌
let wakeLock = null;
async function toggleWake() {
  if (S.wake) { S.wake = false; try { await wakeLock?.release() } catch { } wakeLock = null; render(); return }
  try { wakeLock = await navigator.wakeLock.request('screen'); S.wake = true; toast('화면이 꺼지지 않게 해 둘게요') }
  catch { toast('이 브라우저는 화면 켜두기를 지원하지 않아요') }
  render();
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (S.wake) { try { wakeLock = await navigator.wakeLock.request('screen') } catch { } }
  syncPlayer(); // 돌아오면 다시 맞춤
});

// PC 작은 창: 곡이 바뀌면 창도 따라서 다음 곡으로 바꾸고, 사이트에서 재생되는 곡이 오면 창을 닫음
let ytPop = null, popVid = null;
function followPopup() {
  if (!ytPop) return;
  if (ytPop.closed) { ytPop = null; popVid = null; return }
  const r = S.room;
  if (!r?.videoId) return;
  if (!r.ext) return; // 사이트에서 재생되는 곡이면, 실제로 소리가 나기 시작할 때 창을 닫음
  if (r.playing && r.videoId !== popVid) {
    try { ytPop.location.href = `https://www.youtube.com/watch?v=${r.videoId}&t=${Math.floor(target(r))}s`; popVid = r.videoId } catch { }
  }
}
/* ----- 막힌 영상 대신 틀 영상 찾기 (YouTube Data API) ----- */
// Google Cloud에서 만든 API 키를 넣어 주세요. 비워 두면 이 기능은 꺼지고, 막힌 곡은 유튜브에서 열기로만 들어요.
const YT_KEY = 'AIzaSyAscu5JxdCJ6ALwX1D82dT6NR-m6IYm6Jo';
async function ytApi(path) {
  const r = await fetch(`https://www.googleapis.com/youtube/v3/${path}&key=${YT_KEY}`);
  if (!r.ok) throw new Error('api ' + r.status);
  return r.json();
}
async function findAltFor(vid, title, tried) {
  try {
    let q = title;
    if (!q) { const v = await ytApi(`videos?part=snippet&id=${vid}`); q = v.items?.[0]?.snippet?.title || '' }
    if (!q) return null;
    q = q.replace(/\[[^\]]*\]|\([^)]*(m\/?v|music video|official|뮤직비디오|teaser)[^)]*\)/gi, ' ').replace(/\s+/g, ' ').trim();
    // 다른 사이트에서도 재생되는 영상만 검색 (videoEmbeddable + videoSyndicated)
    const res = await ytApi(`search?part=snippet&type=video&maxResults=8&videoEmbeddable=true&videoSyndicated=true&q=${encodeURIComponent(q)}`);
    const items = (res.items || []).filter(i => i.id?.videoId && !tried.includes(i.id.videoId));
    if (!items.length) return null;
    const topic = items.find(i => /- Topic$/.test(i.snippet?.channelTitle || ''));
    const pick = topic || items.find(i => /lyric|가사|audio|오디오/i.test(i.snippet?.title || '')) || items[0];
    const dec = t => { const d = document.createElement('textarea'); d.innerHTML = t; return d.value };
    return { id: pick.id.videoId, title: title || dec(pick.snippet.title).slice(0, 100) };
  } catch { return null }
}
async function fixBlocked(vid) {
  // 한 사람만 찾도록 먼저 "내가 찾을게" 표시를 남김 (여러 명이 동시에 검색하지 않게)
  let mine = false;
  await roomTx(cur => {
    if (cur.videoId !== vid || cur.ext || cur.fix) return null;
    mine = true; return { ...cur, fix: S.me.uid, tried: [...(cur.tried || []), vid] };
  });
  if (!mine) return;
  const r = S.room, tried = [...(r?.tried || []), vid];
  const alt = YT_KEY && tried.length <= 4 ? await findAltFor(vid, r?.title || '', tried) : null;
  await roomTx(cur => {
    if (cur.videoId !== vid) return null;
    if (alt) return { ...cur, alt: true, videoId: alt.id, title: cur.title || alt.title, fix: '', tried: [...(cur.tried || []), vid], startAt: srvNow(), pos: 0 };
    // 끝까지 못 찾으면 멈춰 있지 않고 다음 곡으로
    const qq = [...(cur.queue || [])], next = qq.shift();
    if (!next) return { ...cur, fix: '', playing: false, pos: 0, queue: [] };
    return { ...cur, videoId: next.videoId, title: next.title, pick: next.pick, ext: !!next.ext, dur: next.dur || 0, playing: true, startAt: srvNow(), pos: 0, queue: qq };
  });
  toast(alt ? '막힌 영상이라 같은 노래의 다른 영상으로 바꿨어요' : '재생할 수 있는 영상을 못 찾아서 다음 곡으로 넘겼어요');
}
// 숨겨 둔 두 번째 플레이어(소리 끔)로 영상을 잠깐 틀어 봐서, 이 사이트에서 재생되는지 미리 확인
let probe = null, probeReady = null, probeCb = null, probeQ = Promise.resolve();
function getProbe() {
  if (probeReady) return probeReady;
  probeReady = loadYT().then(() => new Promise(res => {
    const d = document.createElement('div'); d.id = 'ytprobe'; $('#yt-box').appendChild(d);
    probe = new YT.Player('ytprobe', {
      width: '240', height: '200', playerVars: { playsinline: 1, mute: 1, rel: 0, origin: location.origin, widget_referrer: location.href },
      events: { onReady: () => res(probe), onStateChange: e => probeCb?.('state', e.data), onError: e => probeCb?.('error', e.data) }
    });
  }));
  return probeReady;
}
function testPlayable(id) {
  const run = async () => {
    let p; try { p = await getProbe() } catch { return 'unknown' }
    return new Promise(res => {
      let done = false;
      const fin = v => { if (done) return; done = true; probeCb = null; clearTimeout(to); try { p.stopVideo() } catch { } res(v) };
      probeCb = (k, v) => {
        if (k === 'error') fin([101, 150, 152, 153].includes(v) ? 'blocked' : v === 100 ? 'missing' : 'unknown');
        else if (v === YT.PlayerState.PLAYING) fin('ok');
      };
      const to = setTimeout(() => fin('unknown'), 7000); // 확인이 오래 걸리면 일단 넣고, 재생할 때 다시 확인
      try { p.mute(); p.loadVideoById(id) } catch { fin('unknown') }
    });
  };
  probeQ = probeQ.then(run, run);
  return probeQ;
}
// 음량: 내 기기에서만 바뀌고, 다음에 들어와도 기억해요
function setVol(v) {
  S.vol = Math.max(0, Math.min(100, v | 0));
  try { localStorage.setItem('wb_vol', S.vol) } catch { }
  const el = $('#volv'); if (el) el.textContent = S.vol;
  try { if (playerReady) { S.vol ? player.unMute() : player.mute(); player.setVolume(S.vol) } } catch { }
}
function fmtT(sec) { sec = Math.max(0, Math.floor(sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') }
function parseDur(v) {
  v = String(v).trim(); let m;
  if ((m = v.match(/^(\d{1,2})\s*[:：분.]\s*(\d{1,2})\s*초?$/))) { const s = +m[1] * 60 + +m[2]; return s >= 10 && s <= 1800 ? s : 0 }
  if ((m = v.match(/^(\d{2,4})$/))) { const s = +m[1]; return s >= 10 && s <= 1800 ? s : 0 }
  return 0;
}
// 유튜브에서 듣는 곡: 시간 표시하고, 곡 길이가 지나면 다음 곡으로
let extAdv = null;
setInterval(() => {
  const r = S.room;
  if (!r?.ext || !r.playing) return;
  const t = target(r), el = $('#extt');
  if (el) el.textContent = fmtT(t) + (r.dur ? ' / ' + fmtT(r.dur) : '');
  if (S.me && r.dur && t >= r.dur + 1 && extAdv !== r.videoId + r.startAt) { extAdv = r.videoId + r.startAt; advance(r.videoId) }
}, 1000);

/* ===== 새 버전 자동 적용 ===== */
// 사이트를 새로 올렸는데 휴대폰이 예전 화면을 기억하고 있으면, 알아서 새 버전으로 다시 불러옴
const BUILD = document.querySelector('meta[name="build"]')?.content || '';
async function checkUpdate(force) {
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/<meta name="build" content="([^"]+)"/);
    if (!m || !BUILD || m[1] === BUILD) return;
    let done = ''; try { done = sessionStorage.getItem('wb_reload') || '' } catch { }
    if (done === m[1]) return; // 같은 버전으로 두 번 다시 불러오지 않음
    const busy = S.screen === 'send' || S.editMsg || S.editReply || S.joined;
    if (busy && !force) { toast('새 버전이 있어요. 새로고침해 주세요'); return }
    try { sessionStorage.setItem('wb_reload', m[1]) } catch { }
    location.reload();
  } catch { }
}
checkUpdate(true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(false) });

/* ===== 공통 ===== */
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.go, { owner: S.me?.uid }));
$('#homebtn').onclick = () => { if (S.me) go('home') };

tick(); setInterval(tick, 30000);
render();
